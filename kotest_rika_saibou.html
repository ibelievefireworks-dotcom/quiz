<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>理科 小テスト対策：細胞のつくり</title>
<script src="report.js"></script>
<style>
  :root{
    --bg:#f2fbf6; --card:#fff; --ink:#1f2733; --sub:#6b7686;
    --accent:#059669; --accent-d:#047857;
    --ok:#16a34a; --ok-bg:#dcfce7; --ng:#dc2626; --ng-bg:#fee2e2;
    --line:#d8f0e3; --shadow:0 4px 14px rgba(10,90,60,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px;padding:14px 12px 40px;max-width:480px;margin:0 auto;}
  h1{font-size:19px;margin:6px 0 2px;text-align:center;}
  .lead{text-align:center;color:var(--sub);font-size:13px;margin:0 0 14px;}
  .backlink{display:inline-block;margin-bottom:6px;color:var(--accent);text-decoration:none;font-weight:700;font-size:14px;}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .mode{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;text-align:left;box-shadow:var(--shadow);cursor:pointer;}
  .mode:active{transform:scale(.98);}
  .mode .emo{font-size:26px;}
  .mode .tt b{font-size:16px;display:block;}
  .mode .tt small{color:var(--sub);font-size:12px;}
  .mode .best{font-size:11px;color:var(--ok);font-weight:700;margin-left:auto;}
  .bar{height:8px;background:#e0f3ea;border-radius:99px;overflow:hidden;margin-bottom:8px;}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:12px;}
  .qtag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px;margin-bottom:10px;}
  .q{font-size:18px;font-weight:700;margin:0 0 14px;line-height:1.55;}
  .fig{width:100%;max-width:340px;display:block;margin:0 auto 14px;}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;font-size:16px;color:var(--ink);cursor:pointer;}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg);font-weight:700;}
  .opt.wrong{border-color:var(--ng);background:var(--ng-bg);}
  .opt:disabled{cursor:default;}
  .exp{background:#effaf4;border-left:4px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:14px;color:#334;margin-top:4px;display:none;}
  .exp.show{display:block;}
  .exp .res{font-weight:800;display:block;margin-bottom:3px;}
  .res.y{color:var(--ok);} .res.n{color:var(--ng);}
  .ans{font-size:26px;font-weight:800;color:var(--accent);text-align:center;padding:10px;border:2px dashed var(--accent);border-radius:12px;margin:8px 0;}
  .writebox{border:2px solid var(--line);border-radius:12px;min-height:64px;padding:10px;color:var(--sub);font-size:14px;margin-bottom:10px;background:#fbfdfc;}
  .btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px;box-shadow:var(--shadow);}
  .btn:active{background:var(--accent-d);}
  .btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:none;}
  .btn.gray{background:#eef4f0;color:var(--sub);box-shadow:none;}
  .row{display:flex;gap:10px;}
  .row .btn{margin-top:12px;}
  .btn.ok{background:var(--ok);} .btn.ng{background:var(--ng);}
  .hidden{display:none;}
  .score{text-align:center;padding:8px 0 4px;}
  .score .big{font-size:46px;font-weight:800;line-height:1;}
  .score .pct{font-size:15px;color:var(--sub);}
  .ring{font-size:54px;text-align:center;margin:6px 0;}
  .msg{text-align:center;font-size:16px;font-weight:700;margin:6px 0 16px;}
  .foot{text-align:center;color:var(--sub);font-size:11px;margin-top:18px;}
  .note{font-size:13px;color:#334;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
</style>
</head>
<body>

<div id="home">
  <a class="backlink" href="index.html">← 科目をえらぶ</a>
  <h1>🔬 理科 小テスト対策：細胞のつくり</h1>
  <p class="lead">プリント「生物のからだのつくりとはたらき」全8問<br>本番は<b>順番が変わって出る</b>ので、シャッフルで練習！</p>
  <div class="note">おすすめの順番：①4択で用語を確認 → ②「書く」モードで本番形式を2周（✗ゼロになるまで）。答えは<b>漢字で書ける</b>ことがゴール。</div>
  <div id="modeList"></div>
  <p class="foot">※合格ライン＝全問正解（8/8）。小テストは満点スタートが目標！</p>
</div>

<div id="quiz" class="hidden">
  <div class="card">
    <div class="bar"><i id="prog"></i></div>
    <div class="meta"><span id="modeName"></span><span id="count"></span></div>
    <span class="qtag" id="qtag">問題</span>
    <p class="q" id="qText"></p>
    <div id="figBox"></div>
    <div id="opts"></div>
    <div id="writeArea" class="hidden">
      <div class="writebox">✍️ ノートか紙に<b>漢字で</b>答えを書いてから「答えを見る」</div>
      <button class="btn ghost" id="revealBtn">答えを見る</button>
      <div id="ansBox" class="hidden">
        <div class="ans" id="ansText"></div>
        <div class="row"><button class="btn ok" id="selfOk">⭕ 書けた</button><button class="btn ng" id="selfNg">❌ 書けなかった</button></div>
      </div>
    </div>
    <div class="exp" id="exp"></div>
    <button class="btn hidden" id="nextBtn">次へ →</button>
  </div>
  <button class="btn gray" id="quitBtn">やめてモード一覧へ</button>
</div>

<div id="result" class="hidden">
  <div class="card">
    <div class="ring" id="ring">🎉</div>
    <div class="score"><span class="big" id="scoreNum"></span><span class="pct" id="scorePct"></span></div>
    <div class="msg" id="resMsg"></div>
    <button class="btn ghost hidden" id="retryWrong">まちがえた問題だけ復習（<span id="wrongN"></span>問）</button>
    <button class="btn" id="againBtn">もう一度（全問シャッフル）</button>
    <button class="btn gray" id="homeBtn">モード一覧へ</button>
  </div>
</div>

<script>
const FIG = `<svg class="fig" viewBox="0 0 340 190" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="18" y="22" width="120" height="146" rx="22" fill="#fff" stroke="#333" stroke-width="4"/>
  <rect x="26" y="30" width="104" height="130" rx="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="80" cy="128" rx="34" ry="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="78" cy="78" r="15" fill="#c9a" stroke="#333" stroke-width="1.5"/>
  <circle cx="78" cy="78" r="15" fill="url(#dots)"/>
  <g fill="#ddd" stroke="#333" stroke-width="1.2">
    <ellipse cx="48" cy="52" rx="7" ry="5"/><ellipse cx="108" cy="50" rx="7" ry="5"/><ellipse cx="44" cy="96" rx="7" ry="5"/>
    <ellipse cx="112" cy="88" rx="7" ry="5"/><ellipse cx="60" cy="108" rx="7" ry="5"/><ellipse cx="104" cy="112" rx="7" ry="5"/>
  </g>
  <g stroke="#333" stroke-width="1.2">
    <line x1="138" y1="40" x2="170" y2="40"/><line x1="94" y1="72" x2="170" y2="62"/><line x1="130" y1="100" x2="170" y2="92"/>
    <line x1="112" y1="112" x2="170" y2="118"/><line x1="100" y1="140" x2="170" y2="150"/>
  </g>
  <g font-weight="700"><text x="176" y="45">A</text><text x="176" y="67">B</text><text x="176" y="97">C</text><text x="176" y="123">D</text><text x="176" y="155">E</text></g>
  <ellipse cx="270" cy="95" rx="52" ry="66" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="276" cy="92" r="15" fill="#c9a" stroke="#333" stroke-width="1.5"/>
  <g stroke="#333" stroke-width="1.2"><line x1="262" y1="88" x2="222" y2="66"/><line x1="220" y1="105" x2="232" y2="112"/></g>
  <g font-weight="700"><text x="208" y="62">F</text><text x="206" y="118">G</text></g>
  <defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#633"/></pattern></defs>
</svg>`;

/* プリントの8問をそのまま。o=4択の選択肢（1が正解）、a=書く答え */
const QS = [
  {n:1,q:"生物のからだに共通して見られる小さな部屋のようなものを何というか。",a:"細胞",o:[["細胞",1],["組織",0],["器官",0],["細胞質",0]],e:"「胞」の字に注意（月へん＋包）。すべての生物のからだは細胞でできている。"},
  {n:2,q:"光合成が行われる、細胞の中の緑色をした粒を何というか。",a:"葉緑体",o:[["葉緑体",1],["液胞",0],["核",0],["細胞壁",0]],e:"「葉」「緑」「体」の3文字。植物の細胞だけにある。"},
  {n:3,q:"細胞にふつう1つあり、染色液によく染まる部分を何というか。",a:"核",o:[["核",1],["細胞膜",0],["液胞",0],["葉緑体",0]],e:"核。酢酸カーミン液・酢酸オルセイン液で赤く染まる。問7とセット。"},
  {n:4,q:"液胞や葉緑体のように、植物の細胞にしか見られない部分で、細胞膜の外側にあるつくりを何というか。",a:"細胞壁",o:[["細胞壁",1],["細胞膜",0],["細胞質",0],["核",0]],e:"細胞壁＝細胞膜の「外側」。「壁」と「膜」を書き分ける（壁＝土の字が下）。"},
  {n:5,q:"植物と動物の細胞に共通して見られる部分で、細胞質のいちばん外側にあるつくりを何というか。",a:"細胞膜",o:[["細胞膜",1],["細胞壁",0],["核",0],["液胞",0]],e:"細胞膜＝細胞質のいちばん外側。動物にも植物にもある。「膜」は月へん。"},
  {n:6,q:"細胞膜と、その内側で核以外の部分を何というか。",a:"細胞質",o:[["細胞質",1],["細胞膜",0],["細胞壁",0],["組織",0]],e:"細胞質。核以外の中身ぜんぶ（葉緑体や液胞も細胞質にふくまれる）。"},
  {n:7,fig:true,q:"図は、植物と動物の細胞を模式的に表したものである。染色液で処理するとよく染まる部分を、A〜Gの中からすべて選びなさい。",a:"B、F",o:[["B、F",1],["A、G",0],["B、D、F",0],["Bのみ",0]],e:"染まるのは核。植物の核＝B、動物の核＝F。「すべて選びなさい」なので2つ書く。A＝細胞壁、C＝細胞膜、D＝葉緑体、E＝液胞、G＝細胞膜。"},
  {n:8,q:"小腸や葉のように、いくつかの組織が集まって、1つのまとまった形をもち、特定のはたらきをする部分を何というか。",a:"器官",o:[["器官",1],["組織",0],["個体",0],["細胞",0]],e:"細胞→組織→器官→個体。「いくつかの組織が集まって」＝器官。「器」の字は口が4つ＋大。"},
];

const MODES = {
  choice:{title:"① 4択で確認",emo:"✅",sub:"用語をすぐ思い出せるか（全8問）",write:false},
  write:{title:"② 書く（本番形式）",emo:"✍️",sub:"紙に漢字で書いて自己採点（全8問・シャッフル）",write:true},
};
const $=id=>document.getElementById(id);
let state={};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bestKey(k){return "kotest_rika_saibou_"+k;}
function renderHome(){
  $("home").classList.remove("hidden");$("quiz").classList.add("hidden");$("result").classList.add("hidden");
  const list=$("modeList");list.innerHTML="";
  for(const k in MODES){const m=MODES[k];const best=localStorage.getItem(bestKey(k));
    const b=document.createElement("button");b.className="mode";
    b.innerHTML=`<span class="emo">${m.emo}</span><span class="tt"><b>${m.title}</b><small>${m.sub}</small></span>${best?`<span class="best">最高 ${best}%</span>`:""}`;
    b.onclick=()=>start(k);list.appendChild(b);}
}
function start(mode,subset){
  const qs=subset?subset:QS.slice();
  state={mode,items:shuffle(qs),pos:0,score:0,wrong:[]};
  $("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  $("modeName").textContent=MODES[mode].emo+" "+MODES[mode].title;
  renderQ();
}
function renderQ(){
  const it=state.items[state.pos];const w=MODES[state.mode].write;
  $("count").textContent=`${state.pos+1} / ${state.items.length}`;
  $("prog").style.width=(state.pos/state.items.length*100)+"%";
  $("qtag").textContent="第"+(state.pos+1)+"問（プリント"+it.n+"番）";
  $("qText").textContent=it.q;
  $("figBox").innerHTML=it.fig?FIG:"";
  $("exp").className="exp";$("exp").innerHTML="";$("nextBtn").classList.add("hidden");
  const box=$("opts");box.innerHTML="";
  if(w){
    box.classList.add("hidden");$("writeArea").classList.remove("hidden");
    $("ansBox").classList.add("hidden");$("revealBtn").classList.remove("hidden");
    $("ansText").textContent=it.a;
  }else{
    box.classList.remove("hidden");$("writeArea").classList.add("hidden");
    shuffle(it.o).forEach(op=>{const b=document.createElement("button");b.className="opt";b.textContent=op[0];b.onclick=()=>answer(b,op[1]===1,it);box.appendChild(b);});
  }
  window.scrollTo(0,0);
}
function correctText(it){return it.o.find(o=>o[1]===1)[0];}
function finish(correct,it){
  if(correct)state.score++;else state.wrong.push(it);
  const exp=$("exp");exp.innerHTML=`<span class="res ${correct?'y':'n'}">${correct?'⭕ 正解！':'❌ ここを復習'}</span>${it.e}`;
  exp.classList.add("show");$("nextBtn").classList.remove("hidden");
}
function answer(btn,correct,it){
  $("opts").querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===correctText(it))b.classList.add("correct");});
  if(!correct)btn.classList.add("wrong");
  finish(correct,it);
}
$("revealBtn").onclick=()=>{$("revealBtn").classList.add("hidden");$("ansBox").classList.remove("hidden");};
$("selfOk").onclick=()=>{$("ansBox").classList.add("hidden");finish(true,state.items[state.pos]);};
$("selfNg").onclick=()=>{$("ansBox").classList.add("hidden");finish(false,state.items[state.pos]);};
$("nextBtn").onclick=()=>{state.pos++;if(state.pos>=state.items.length)renderResult();else renderQ();};
function renderResult(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  const total=state.items.length,sc=state.score,pct=Math.round(sc/total*100);
  $("scoreNum").textContent=`${sc} / ${total}`;$("scorePct").textContent=`正答率 ${pct}%`;
  let ring,msg;
  if(pct===100){ring="🎉";msg="全問正解！明日はこの調子で満点！";}
  else if(pct>=75){ring="💪";msg="あと少し！まちがえた問題だけもう1周";}
  else{ring="📖";msg="解説を読んで、書けなかった用語を3回書こう";}
  $("ring").textContent=ring;$("resMsg").textContent=msg;
  if(state.items.length===QS.length){
    const prev=parseInt(localStorage.getItem(bestKey(state.mode))||"0");
    if(pct>prev)localStorage.setItem(bestKey(state.mode),pct);
    if(typeof reportUnit==="function")reportUnit("🔬 理科 小テスト対策（細胞のつくり）："+MODES[state.mode].title+"\n"+total+"問 → "+sc+"問正解（"+pct+"%）\n"+(pct===100?"🎉 全問正解！":"あと少し！復習します💪")+"\n#莉映の小テスト対策");
  }
  const rw=$("retryWrong");
  if(state.wrong.length>0){rw.classList.remove("hidden");$("wrongN").textContent=state.wrong.length;rw.onclick=()=>start(state.mode,state.wrong.slice());}
  else rw.classList.add("hidden");
}
$("againBtn").onclick=()=>start(state.mode);
$("homeBtn").onclick=renderHome;
$("quitBtn").onclick=()=>{if(confirm("モード一覧に戻りますか？"))renderHome();};
renderHome();
</script>
</body>
</html>

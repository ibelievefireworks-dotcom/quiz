<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  .ans{font-size:26px;font-weight:800;color:var(--accent);text-align:center;padding:10px;border:2px dashed var(--accent);border-radius:12px;margin:8px 0;}
  .writebox{border:2px solid var(--line);border-radius:12px;min-height:64px;padding:10px;color:var(--sub);font-size:14px;margin-bottom:10px;background:#fbfdfc;}
  .btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px;box-shadow:var(--shadow);}
  .btn:active{background:var(--accent-d);}
  .btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:none;}
  .btn.gray{background:#eef4f0;color:var(--sub);box-shadow:none;}
  .row{display:flex;gap:10px;}
  .row .btn{margin-top:12px;}
  .btn.ok{background:var(--ok);} .btn.ng{background:var(--ng);}
  .hidden{display:none;}
  .score{text-align:center;padding:8px 0 4px;}
  .score .big{font-size:46px;font-weight:800;line-height:1;}
  .score .pct{font-size:15px;color:var(--sub);}
  .ring{font-size:54px;text-align:center;margin:6px 0;}
  .msg{text-align:center;font-size:16px;font-weight:700;margin:6px 0 16px;}
  .foot{text-align:center;color:var(--sub);font-size:11px;margin-top:18px;}

</style>

<script>

/* セット1：プリントの8問をそのまま。o=4択の選択肢（1が正解）、a=書く答え */
const QS1 = [
  {n:1,q:"生物のからだに共通して見られる小さな部屋のようなものを何というか。",a:"細胞",o:[["細胞",1],["組織",0],["器官",0],["細胞質",0]],e:"「胞」の字に注意（月へん＋包）。すべての生物のからだは細胞でできている。"},
  {n:2,q:"光合成が行われる、細胞の中の緑色をした粒を何というか。",a:"葉緑体",o:[["葉緑体",1],["液胞",0],["核",0],["細胞壁",0]],e:"「葉」「緑」「体」の3文字。植物の細胞だけにある。"},
  {n:3,q:"細胞にふつう1つあり、染色液によく染まる部分を何というか。",a:"核",o:[["核",1],["細胞膜",0],["液胞",0],["葉緑体",0]],e:"核。酢酸カーミン液・酢酸オルセイン液で赤く染まる。問7とセット。"},
  {n:4,q:"液胞や葉緑体のように、植物の細胞にしか見られない部分で、細胞膜の外側にあるつくりを何というか。",a:"細胞壁",o:[["細胞壁",1],["細胞膜",0],["細胞質",0],["核",0]],e:"細胞壁＝細胞膜の「外側」。「壁」と「膜」を書き分ける（壁＝土の字が下）。"},
  {n:5,q:"植物と動物の細胞に共通して見られる部分で、細胞質のいちばん外側にあるつくりを何というか。",a:"細胞膜",o:[["細胞膜",1],["細胞壁",0],["核",0],["液胞",0]],e:"細胞膜＝細胞質のいちばん外側。動物にも植物にもある。「膜」は月へん。"},
  {n:6,q:"細胞膜と、その内側で核以外の部分を何というか。",a:"細胞質",o:[["細胞質",1],["細胞膜",0],["細胞壁",0],["組織",0]],e:"細胞質。核以外の中身ぜんぶ（葉緑体や液胞も細胞質にふくまれる）。"},
  {n:7,fig:true,q:"図は、植物と動物の細胞を模式的に表したものである。染色液で処理するとよく染まる部分を、A〜Gの中からすべて選びなさい。",a:"B、F",o:[["B、F",1],["A、G",0],["B、D、F",0],["Bのみ",0]],e:"染まるのは核。植物の核＝B、動物の核＝F。「すべて選びなさい」なので2つ書く。A＝細胞壁、C＝細胞膜、D＝葉緑体、E＝液胞、G＝細胞膜。"},
  {n:8,q:"小腸や葉のように、いくつかの組織が集まって、1つのまとまった形をもち、特定のはたらきをする部分を何というか。",a:"器官",o:[["器官",1],["組織",0],["個体",0],["細胞",0]],e:"細胞→組織→器官→個体。「いくつかの組織が集まって」＝器官。「器」の字は口が4つ＋大。"},
];

/* セット2：同じ答えを別の言い方で／用語→説明の逆問い */
const QS2 = [
  {n:"言い換え",q:"細胞の中にあって、光合成が行われる場所はどこか。",a:"葉緑体",o:[["葉緑体",1],["液胞",0],["核",0],["細胞質",0]],e:"「光合成の場」ときたら葉緑体。緑色の粒。"},
  {n:"言い換え",q:"酢酸カーミン液や酢酸オルセイン液で赤く染まる、細胞に1つある丸いつくりは何か。",a:"核",o:[["核",1],["葉緑体",0],["細胞膜",0],["液胞",0]],e:"染色液の名前が出ても答えは核。"},
  {n:"言い換え",q:"植物の細胞で、細胞膜のさらに外側をおおっている丈夫なつくりは何か。",a:"細胞壁",o:[["細胞壁",1],["細胞膜",0],["細胞質",0],["液胞",0]],e:"「外側」「丈夫」「植物だけ」＝細胞壁。からだを支える役目。"},
  {n:"言い換え",q:"動物の細胞にもある、細胞のいちばん外側をつつむうすい膜は何か。",a:"細胞膜",o:[["細胞膜",1],["細胞壁",0],["核",0],["葉緑体",0]],e:"動物にもある＝細胞壁ではなく細胞膜。"},
  {n:"言い換え",q:"細胞の中身のうち、核と細胞膜をのぞいた部分全体を何というか。",a:"細胞質",o:[["細胞質",1],["細胞液",0],["組織",0],["液胞",0]],e:"細胞質。葉緑体や液胞は細胞質の中にある。"},
  {n:"言い換え",q:"形やはたらきが同じ細胞の集まりを組織という。では、組織がいくつか集まって、まとまった形と特定のはたらきをもつものを何というか。",a:"器官",o:[["器官",1],["個体",0],["細胞",0],["組織",0]],e:"組織→器官。胃・小腸・葉・根はすべて器官。"},
  {n:"逆問い",q:"「細胞質」の説明として正しいものはどれか。（書くモード：細胞質とはどの部分か、一文で説明せよ）",a:"細胞膜の内側で、核以外の部分",o:[["細胞膜の内側で、核以外の部分",1],["細胞膜の外側にある丈夫なつくり",0],["染色液でよく染まる丸い部分",0],["光合成を行う緑色の粒",0]],e:"プリント6番の逆。説明を自分の言葉で言えると本番で言い回しが変わっても対応できる。"},
  {n:"逆問い",q:"「細胞壁」は細胞膜の内側・外側のどちらにあるか。また、動物の細胞にあるか。",a:"外側にある・動物の細胞にはない",o:[["外側にある・動物の細胞にはない",1],["内側にある・動物の細胞にもある",0],["外側にある・動物の細胞にもある",0],["内側にある・動物の細胞にはない",0]],e:"細胞壁＝細胞膜の外側、植物だけ。プリント4番の逆問い。"},
  {n:"逆問い",q:"植物の細胞にしか見られないつくりを3つ答えよ。",a:"細胞壁・葉緑体・液胞",o:[["細胞壁・葉緑体・液胞",1],["核・細胞膜・細胞質",0],["細胞壁・核・液胞",0],["葉緑体・細胞膜・核",0]],e:"「壁・緑・液」の3つ。核・細胞膜・細胞質は動物と共通。"},
  {n:"言い換え",q:"生物のからだをつくる、いちばん小さな基本の単位は何か。",a:"細胞",o:[["細胞",1],["組織",0],["器官",0],["核",0]],e:"「部屋のようなもの」＝「基本の単位」＝細胞。"},
];

/* セット3：図のA〜G・順番・分類 */
const QS3 = [
  {n:"図",fig:true,q:"図のAのつくりの名前は何か。",a:"細胞壁",o:[["細胞壁",1],["細胞膜",0],["核",0],["液胞",0]],e:"いちばん外側の厚い線＝細胞壁。"},
  {n:"図",fig:true,q:"図のBのつくりの名前は何か。",a:"核",o:[["核",1],["葉緑体",0],["液胞",0],["細胞質",0]],e:"中央の丸＝核。染色液で染まる。"},
  {n:"図",fig:true,q:"図のCのつくりの名前は何か。",a:"細胞膜",o:[["細胞膜",1],["細胞壁",0],["細胞質",0],["核",0]],e:"細胞壁のすぐ内側のうすい線＝細胞膜。"},
  {n:"図",fig:true,q:"図のDのつくりの名前は何か。",a:"葉緑体",o:[["葉緑体",1],["液胞",0],["核",0],["細胞膜",0]],e:"小さな粒がたくさん＝葉緑体。"},
  {n:"図",fig:true,q:"図のEのつくりの名前は何か。",a:"液胞",o:[["液胞",1],["葉緑体",0],["核",0],["細胞質",0]],e:"大きなふくろ＝液胞。成長した植物の細胞で大きい。"},
  {n:"図",fig:true,q:"図のF・Gのつくりの名前をそれぞれ答えよ。",a:"F＝核、G＝細胞膜",o:[["F＝核、G＝細胞膜",1],["F＝核、G＝細胞壁",0],["F＝葉緑体、G＝細胞膜",0],["F＝液胞、G＝細胞壁",0]],e:"動物の細胞には細胞壁がないので、いちばん外側は細胞膜。"},
  {n:"図",fig:true,q:"図で、動物の細胞には見られないつくりをA〜Eからすべて選べ。",a:"A、D、E",o:[["A、D、E",1],["B、C",0],["A、B、D",0],["Aのみ",0]],e:"A細胞壁・D葉緑体・E液胞＝植物だけ。B核・C細胞膜は動物にもある。"},
  {n:"順番",q:"細胞・組織・器官・個体を、小さいものから順に並べよ。",a:"細胞→組織→器官→個体",o:[["細胞→組織→器官→個体",1],["細胞→器官→組織→個体",0],["組織→細胞→器官→個体",0],["細胞→組織→個体→器官",0]],e:"細（さい）→組（そ）→器（き）→個（こ）。プリント8番の土台。"},
  {n:"分類",q:"植物と動物の細胞に共通して見られるつくりをすべて答えよ。",a:"核・細胞膜・細胞質",o:[["核・細胞膜・細胞質",1],["核・細胞壁・葉緑体",0],["細胞膜・液胞・葉緑体",0],["核だけ",0]],e:"共通＝核・細胞膜・細胞質。プリント5番「共通して見られる」の発展。"},
  {n:"分類",q:"次のうち、器官にあたるものをすべて選べ：小腸・葉・筋肉の細胞・根",a:"小腸・葉・根",o:[["小腸・葉・根",1],["小腸・葉・筋肉の細胞・根",0],["葉・根",0],["筋肉の細胞",0]],e:"小腸・葉・根＝器官。筋肉の細胞は「細胞」。"},
];

const SETS = {
  s1:{title:"セット1：プリントそのまま（選択式）",emo:"📄",sub:"本番と同じ8問を4択で（順番シャッフル）",qs:QS1,write:false},
  s2:{title:"セット2：言い方を変えて・逆から（選択式）",emo:"🔁",sub:"同じ答えを別の問い方で／用語→説明（10問）",qs:QS2,write:false},
  s3:{title:"セット3：図と関係（選択式）",emo:"🔬",sub:"図のA〜Gは何か・並び順・植物と動物の分類（10問）",qs:QS3,write:false},
  s4:{title:"セット4：記述（本番形式）",emo:"✍️",sub:"プリントの8問を紙に漢字で書いて自己採点。✗ゼロがゴール",qs:QS1,write:true},
};
const $=id=>document.getElementById(id);
let state={};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bestKey(s){return "kotest_rika_saibou_"+s;}
function renderHome(){
  $("home").classList.remove("hidden");$("quiz").classList.add("hidden");$("result").classList.add("hidden");
  const list=$("modeList");list.innerHTML="";
  for(const s in SETS){const st=SETS[s];const best=localStorage.getItem(bestKey(s));
    const b=document.createElement("button");b.className="mode";
    b.innerHTML=`<span class="emo">${st.emo}</span><span class="tt"><b>${st.title}</b><small>${st.sub}</small></span>${best?`<span class="best">最高 ${best}%</span>`:""}`;
    b.onclick=()=>start(s);list.appendChild(b);}
}
function start(set,subset){
  const qs=subset?subset:SETS[set].qs.slice();
  state={set,items:shuffle(qs),pos:0,score:0,wrong:[]};
  $("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  $("modeName").textContent=SETS[set].emo+" "+SETS[set].title;
  renderQ();
}
function renderQ(){
  const it=state.items[state.pos];const w=SETS[state.set].write;
  $("count").textContent=`${state.pos+1} / ${state.items.length}`;
  $("prog").style.width=(state.pos/state.items.length*100)+"%";
  $("qtag").textContent="第"+(state.pos+1)+"問（"+(typeof it.n==="number"?"プリント"+it.n+"番":it.n)+"）";
  $("qText").textContent=it.q;
  $("figBox").innerHTML=it.fig?FIG:"";
  $("exp").className="exp";$("exp").innerHTML="";$("nextBtn").classList.add("hidden");
  const box=$("opts");box.innerHTML="";
  if(w){
    box.classList.add("hidden");$("writeArea").classList.remove("hidden");
    $("ansBox").classList.add("hidden");$("revealBtn").classList.remove("hidden");
    $("ansText").textContent=it.a;
  }else{
    box.classList.remove("hidden");$("writeArea").classList.add("hidden");
    shuffle(it.o).forEach(op=>{const b=document.createElement("button");b.className="opt";b.textContent=op[0];b.onclick=()=>answer(b,op[1]===1,it);box.appendChild(b);});
  }
  window.scrollTo(0,0);
}
function correctText(it){return it.o.find(o=>o[1]===1)[0];}
function finish(correct,it){
  if(correct)state.score++;else state.wrong.push(it);
  const exp=$("exp");exp.innerHTML=`<span class="res ${correct?'y':'n'}">${correct?'⭕ 正解！':'❌ ここを復習'}</span>${it.e}`;
  exp.classList.add("show");$("nextBtn").classList.remove("hidden");
}
function answer(btn,correct,it){
  $("opts").querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===correctText(it))b.classList.add("correct");});
  if(!correct)btn.classList.add("wrong");
  finish(correct,it);
}
$("revealBtn").onclick=()=>{$("revealBtn").classList.add("hidden");$("ansBox").classList.remove("hidden");};
$("selfOk").onclick=()=>{$("ansBox").classList.add("hidden");finish(true,state.items[state.pos]);};
$("selfNg").onclick=()=>{$("ansBox").classList.add("hidden");finish(false,state.items[state.pos]);};
$("nextBtn").onclick=()=>{state.pos++;if(state.pos>=state.items.length)renderResult();else renderQ();};
function renderResult(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  const total=state.items.length,sc=state.score,pct=Math.round(sc/total*100);
  $("scoreNum").textContent=`${sc} / ${total}`;$("scorePct").textContent=`正答率 ${pct}%`;
  let ring,msg;
  if(pct===100){ring="🎉";msg="全問正解！明日はこの調子で満点！";}
  else if(pct>=75){ring="💪";msg="あと少し！まちがえた問題だけもう1周";}
  else{ring="📖";msg="解説を読んで、書けなかった用語を3回書こう";}
  $("ring").textContent=ring;$("resMsg").textContent=msg;
  if(state.items.length===SETS[state.set].qs.length){
    const prev=parseInt(localStorage.getItem(bestKey(state.set))||"0");
    if(pct>prev)localStorage.setItem(bestKey(state.set),pct);
    if(typeof reportUnit==="function")reportUnit("🔬 理科 小テスト対策（細胞のつくり）："+SETS[state.set].title+"\n"+total+"問 → "+sc+"問正解（"+pct+"%）\n"+(pct===100?"🎉 全問正解！":"あと少し！復習します💪")+"\n#莉映の小テスト対策");
  }
  const rw=$("retryWrong");
  if(state.wrong.length>0){rw.classList.remove("hidden");$("wrongN").textContent=state.wrong.length;rw.onclick=()=>start(state.set,state.wrong.slice());}
  else rw.classList.add("hidden");
}
$("againBtn").onclick=()=>start(state.set);
$("homeBtn").onclick=renderHome;
$("quitBtn").onclick=()=>{if(confirm("モード一覧に戻りますか？"))renderHome();};
renderHome();
</script>
</body>
</html>

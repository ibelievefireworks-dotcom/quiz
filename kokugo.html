<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>国語 期末対策クイズ</title>
<style>
  :root{
    --bg:#fbf8f4; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
    --accent:#b45309; --accent-d:#92400e;
    --ok:#16a34a; --ok-bg:#dcfce7; --ng:#dc2626; --ng-bg:#fee2e2;
    --line:#efe7da; --shadow:0 4px 14px rgba(80,50,10,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink);
    line-height:1.6; font-size:17px;
    padding:14px 12px 40px; max-width:480px; margin:0 auto;
  }
  h1{font-size:20px; margin:6px 0 2px; text-align:center;}
  .lead{text-align:center; color:var(--sub); font-size:13px; margin:0 0 16px;}
  .backlink{display:inline-block; margin-bottom:6px; color:var(--accent); text-decoration:none; font-weight:700; font-size:14px;}
  .card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px;}
  .topic{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 14px; margin-bottom:11px; text-align:left;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .08s;
  }
  .topic:active{transform:scale(.98);}
  .topic .emo{font-size:26px; flex:0 0 auto;}
  .topic .tt{flex:1 1 auto;}
  .topic .tt b{font-size:16px; display:block;}
  .topic .tt small{color:var(--sub); font-size:12px;}
  .topic .best{font-size:11px; color:var(--ok); font-weight:700; flex:0 0 auto;}
  .arrow{color:var(--accent); font-weight:700;}
  .bar{height:8px; background:#f0e7d8; border-radius:99px; overflow:hidden; margin-bottom:8px;}
  .bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s;}
  .meta{display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:14px;}
  .qtag{display:inline-block; font-size:11px; font-weight:700; color:#fff; background:var(--accent); border-radius:6px; padding:2px 8px; margin-bottom:10px;}
  .q{font-size:18px; font-weight:700; margin:0 0 16px; line-height:1.55;}
  .opt{
    display:block; width:100%; text-align:left; background:#fff;
    border:2px solid var(--line); border-radius:12px; padding:13px 14px;
    margin-bottom:10px; font-size:16px; color:var(--ink); cursor:pointer; transition:.1s;
  }
  .opt:active{transform:scale(.99);}
  .opt.correct{border-color:var(--ok); background:var(--ok-bg); font-weight:700;}
  .opt.wrong{border-color:var(--ng); background:var(--ng-bg);}
  .opt:disabled{cursor:default;}
  .exp{
    background:#fbf3e8; border-left:4px solid var(--accent); border-radius:8px;
    padding:11px 13px; font-size:14px; color:#334; margin-top:4px; display:none;
  }
  .exp.show{display:block;}
  .exp .res{font-weight:800; display:block; margin-bottom:3px;}
  .res.y{color:var(--ok);} .res.n{color:var(--ng);}
  .btn{
    display:block; width:100%; background:var(--accent); color:#fff; border:none;
    border-radius:12px; padding:15px; font-size:17px; font-weight:700; cursor:pointer;
    margin-top:14px; box-shadow:var(--shadow);
  }
  .btn:active{background:var(--accent-d);}
  .btn.ghost{background:#fff; color:var(--accent); border:2px solid var(--accent); box-shadow:none;}
  .btn.gray{background:#f1eee8; color:var(--sub); box-shadow:none;}
  .hidden{display:none;}
  .score{text-align:center; padding:8px 0 4px;}
  .score .big{font-size:46px; font-weight:800; line-height:1;}
  .score .pct{font-size:15px; color:var(--sub);}
  .ring{font-size:54px; text-align:center; margin:6px 0;}
  .msg{text-align:center; font-size:16px; font-weight:700; margin:6px 0 16px;}
  .foot{text-align:center; color:var(--sub); font-size:11px; margin-top:18px;}
</style>
<script src="report.js"></script>
</head>
<body>

<div id="home">
  <a class="backlink" href="index.html">← 科目をえらぶ</a>
  <h1>📖 国語 期末対策クイズ</h1>
  <p class="lead">1学期末考査 / アイスプラネット・見えないだけ・枕草子・クマゼミ・文法・漢字<br>テーマを選んでスタート！</p>
  <a href="output.html?subj=国語" style="display:block;text-align:center;text-decoration:none;font-weight:700;border:2px dashed var(--accent);color:var(--accent);border-radius:14px;padding:12px;margin:2px 0 14px;background:var(--card);">✍️ 書く・言うで仕上げる（漢字書き・記述）→</a>
  <div id="topicList"></div>
  <p class="foot">※「合格ライン」は正答率80%。<br>まちがえた問題だけやり直せます。</p>
</div>

<div id="quiz" class="hidden">
  <div class="card">
    <div class="bar"><i id="prog"></i></div>
    <div class="meta"><span id="topicName"></span><span id="count"></span></div>
    <span class="qtag" id="qtag">問題</span>
    <p class="q" id="qText"></p>
    <div id="opts"></div>
    <div class="exp" id="exp"></div>
    <button class="btn hidden" id="nextBtn">次へ →</button>
  </div>
  <button class="btn gray" id="quitBtn">やめてテーマ一覧へ</button>
</div>

<div id="result" class="hidden">
  <div class="card">
    <div class="ring" id="ring">🎉</div>
    <div class="score"><span class="big" id="scoreNum"></span><span class="pct" id="scorePct"></span></div>
    <div class="msg" id="resMsg"></div>
    <button class="btn ghost hidden" id="retryWrong">まちがえた問題だけ復習（<span id="wrongN"></span>問）</button>
    <button class="btn" id="againBtn">もう一度（全問）</button>
    <button class="btn gray" id="homeBtn">テーマ一覧へ</button>
  </div>
</div>

<script>
const QUIZ = {

    {q:"「精密」の意味に最も近いのは？",

    {q:"「歓迎」の意味は？",

    {q:"ぐうちゃん（おじさん）の本名と年齢は？",
     o:[["津田由起夫・38歳",1],["椎名誠・40歳",0],["津田悠太・15歳",0],["由起夫・50歳",0]],

    {q:"「口実」の意味は？",
     o:[["言いのがれのための理由",1],["本当の目的",0],["約束したこと",0],["うそのない事実",0]],

  miezai: { title:"見えないだけ（牟礼慶子・詩）", emo:"🌌", questions:[

     o:[["牟礼慶子",1],["清少納言",0],["椎名誠",0],["金子みすゞ",0]],

     o:[["音数などの形の決まりがない詩",1],["五・七・五の詩",0],["昔の言葉の詩",0],["必ず四行の詩",0]],

     e:"擬人法。海や言葉を、人のようにふるまうものとして表している。"},
    {q:"「空の上には／青い空が浮かんでいる」と「波の底には／大きな海が眠っている」のように、似た組み立ての句を並べる技法は？",

     e:"対句（法）。形や意味が対応する句を並べ、調子を整え印象を強める。"},
    {q:"「待ちかねている新しい友だち」「美しい季節」のように、行の終わりを名詞（体言）で止める技法は？",
     o:[["体言止め",1],["擬人法",0],["対句",0],["比喩",0]],
     e:"体言止め。行末を名詞で止めて、余韻を残す。"},
    {q:"この詩で作者が最も伝えたいこと（主題）は？",
     o:[["目に見えなくても、希望や可能性は確かに在るということ",1],["海や空は美しいということ",0],["友だちは少ないほうがよいということ",0],["昔のほうがよかったということ",0]],

     e:"「あんなに確かに在るものが／まだここからは見えないだけ」という結びに主題が表れている。"},

  makura: { title:"枕草子（清少納言・古文）", emo:"🌸", questions:[
    {q:"『枕草子』の作者はだれ？",

    {q:"『枕草子』の世界をよく表す、明るく知的な美しさを表す言葉は？",

    {q:"「つとめて」の意味は？",

    {q:"歴史的仮名遣いで語の中や終わりにある「は・ひ・ふ・へ・ほ」は、現代仮名遣いでどう読む？",

    {q:"「いとをかし」の「いと」の意味は？",
     o:[["とても",1],["少し",0],["まったく〜ない",0],["ときどき",0]],

    {q:"「わろし」の意味は？",
     o:[["よくない（好ましくない）",1],["とても悪い",0],["かわいい",0],["おもしろい",0]],
     e:"わろし＝よくない・感心しない。「悪し（あし）」ほど悪くはない程度。"},
    {q:"「あはれなり」の「あはれ」の意味は？",
     o:[["しみじみとした趣がある",1],["かわいそうで気の毒だ",0],["おかしくて笑える",0],["おそろしい",0]],
     e:"古語の「あはれ」は、しみじみと心に深く感じる趣。現代の「かわいそう」とは異なる。"},
    {q:"歴史的仮名遣いの「au（あう）」の音は、現代仮名遣いでどう読む？",
     o:[["ô（おう）",1],["あう のまま",0],["ゆう",0],["えう",0]],

const $ = id => document.getElementById(id);
let state = {};
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function bestKey(k){return "kokugo_best_"+k;}
function renderHome(){
  $("home").classList.remove("hidden"); $("quiz").classList.add("hidden"); $("result").classList.add("hidden");
  const list=$("topicList"); list.innerHTML="";
  for(const key in QUIZ){
    const t=QUIZ[key]; const best=localStorage.getItem(bestKey(key));
    const b=document.createElement("button"); b.className="topic";
    b.innerHTML=`<span class="emo">${t.emo}</span>
      <span class="tt"><b>${t.title}</b><small>全${t.questions.length}問</small></span>
      ${best?`<span class="best">最高 ${best}%</span>`:``}<span class="arrow">▶</span>`;
    b.onclick=()=>startTopic(key); list.appendChild(b);
  }
}
function startTopic(key, subset){
  const t=QUIZ[key];
  let qs = subset ? subset.map(i=>t.questions[i]) : t.questions.slice();
  state={ key, items:shuffle(qs), pos:0, score:0, wrong:[] };
  $("home").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
  $("topicName").textContent=t.emo+" "+t.title;
  renderQuestion();
}
function renderQuestion(){
  const it=state.items[state.pos];
  $("count").textContent=`${state.pos+1} / ${state.items.length}`;
  $("prog").style.width=(state.pos/state.items.length*100)+"%";
  $("qtag").textContent="第"+(state.pos+1)+"問";
  $("qText").textContent=it.q;
  $("exp").className="exp"; $("exp").innerHTML=""; $("nextBtn").classList.add("hidden");
  const box=$("opts"); box.innerHTML="";
  shuffle(it.o).forEach(op=>{
    const btn=document.createElement("button"); btn.className="opt"; btn.textContent=op[0];
    btn.onclick=()=>answer(btn,op[1]===1,it); box.appendChild(btn);
  });
  window.scrollTo(0,0);
}
function correctText(it){ return it.o.find(o=>o[1]===1)[0]; }
function answer(btn, correct, it){
  $("opts").querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.textContent===correctText(it)) b.classList.add("correct"); });
  if(correct){ state.score++; } else { btn.classList.add("wrong"); state.wrong.push(it); }
  const exp=$("exp");
  exp.innerHTML=`<span class="res ${correct?'y':'n'}">${correct?'⭕ 正解！':'❌ ざんねん'}</span>${it.e}`;
  exp.classList.add("show"); $("nextBtn").classList.remove("hidden");
}
$("nextBtn").onclick=()=>{ state.pos++; if(state.pos>=state.items.length) renderResult(); else renderQuestion(); };
function renderResult(){
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  const total=state.items.length, sc=state.score, pct=Math.round(sc/total*100);
  $("scoreNum").textContent=`${sc} / ${total}`; $("scorePct").textContent=`正答率 ${pct}%`;
  let ring,msg;
  if(pct>=80){ring="🎉";msg="合格ライン突破！この調子！";}
  else if(pct>=60){ring="💪";msg="あと少し！まちがえた問題を復習しよう";}
  else{ring="📖";msg="まずは解説を読んで基礎固めだ！";}
  $("ring").textContent=ring; $("resMsg").textContent=msg;
  if(state.items.length===QUIZ[state.key].questions.length){
    const prev=parseInt(localStorage.getItem(bestKey(state.key))||"0");
    if(pct>prev) localStorage.setItem(bestKey(state.key),pct);
    if(typeof reportUnit==="function") reportUnit("📖 国語："+QUIZ[state.key].title+"\n4択クイズ "+total+"問 → "+sc+"問正解（"+pct+"%）\n"+(pct>=80?"🎉 合格ライン80%クリア！":"あと少し！復習します💪")+"\n#莉映の期末対策");
  }
  const rw=$("retryWrong");
  if(state.wrong.length>0){
    rw.classList.remove("hidden"); $("wrongN").textContent=state.wrong.length;
    rw.onclick=()=>{ const t=QUIZ[state.key]; const idx=state.wrong.map(w=>t.questions.indexOf(w)); startTopic(state.key, idx); };
  } else { rw.classList.add("hidden"); }
}
$("againBtn").onclick=()=>startTopic(state.key);
$("homeBtn").onclick=renderHome;
$("quitBtn").onclick=()=>{ if(confirm("テーマ一覧に戻りますか？（今の点数は記録されません）")) renderHome(); };
renderHome();
</script>

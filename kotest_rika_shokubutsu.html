<script>

/* セット1：プリント原文（表8問＋裏4問＝12問） */
const QS1 = [
  {n:1,q:"光合成が行われる、細胞の中の緑色をした粒を何というか。",a:"葉緑体",o:[["葉緑体",1],["液胞",0],["核",0],["細胞壁",0]],e:"表1番。細胞の小テストと同じ問題が再登場。"},
  {n:2,q:"根から吸収した水や水にとけた養分などが通る管を何というか。",a:"道管",o:[["道管",1],["師管",0],["気管",0],["血管",0]],e:"表2番。「水（みず）は道（みち）を通る」。"},
  {n:3,q:"葉でつくられた栄養分が運ばれる管を何というか。",a:"師管",o:[["師管",1],["道管",0],["維管束",0],["気孔",0]],e:"表3番。「師」は「師匠」の師。「詩」「支」と書かない。"},
  {n:4,q:"葉の表皮にある孔辺細胞に囲まれたすきまを何というか。",a:"気孔",o:[["気孔",1],["気管",0],["柔毛",0],["葉脈",0]],e:"表4番。孔辺細胞（三日月形の細胞2つ）に囲まれたすきま＝気孔。ふつう葉の裏に多い。"},
  {n:5,q:"植物の体から水が水蒸気となって出ていく現象を何というか。",a:"蒸散",o:[["蒸散",1],["蒸発",0],["呼吸",0],["光合成",0]],e:"表5番。「蒸散」の「散」を忘れない。蒸発（物理現象）と区別。"},
  {n:6,q:"茎の維管束が散在しているのは、被子植物の（　）のなかまである。（　）にあてはまる言葉は何か。",a:"単子葉類",o:[["単子葉類",1],["双子葉類",0],["裸子植物",0],["シダ植物",0]],e:"表6番。散らばっている＝単子葉類（トウモロコシ・イネ・ユリ）。"},
  {n:7,q:"茎の維管束が輪のように並んでいるのは、被子植物の（　）のなかまである。（　）にあてはまる言葉は何か。",a:"双子葉類",o:[["双子葉類",1],["単子葉類",0],["裸子植物",0],["コケ植物",0]],e:"表7番。輪＝双子葉類（ホウセンカ・アサガオ・ヒマワリ）。"},
  {n:8,fig:"cross",q:"図は、ある植物の茎と葉の断面を模式的に表したものである。この植物に赤く着色した水を根から吸わせたとき、赤く染まる部分をA〜Dの中からすべて選びなさい。",a:"A、C",o:[["A、C",1],["B、D",0],["A、D",0],["B、C",0]],e:"表8番。赤い水が通る＝道管。プリントの答えは「A、C」＝茎ではA、葉では表側のC。「すべて選ぶ」なので2つ書く。"},
  {n:"裏1",fig:"asagao",q:"ふ入りのアサガオの葉の一部をアルミニウムはくでおおい、じゅうぶんに光を当てた。葉の部分A〜Dのうち、光合成が行われた部分を選びなさい。",a:"A",o:[["A",1],["B",0],["C",0],["D",0]],e:"裏1番。光あり＋葉緑体あり＝A だけ。"},
  {n:"裏2",fig:"asagao",q:"ふ入りのアサガオの葉の一部をアルミニウムはくでおおい、じゅうぶんに光を当てた。葉の部分A〜Dのうち、葉緑体はあるが光が当たらなかった部分を選びなさい。",a:"B",o:[["B",1],["A",0],["C",0],["D",0]],e:"裏2番。緑の部分でアルミはくの下＝B。「光が必要」を示す比較相手。"},
  {n:"裏3",fig:"asagao",q:"ふ入りのアサガオの葉の一部をアルミニウムはくでおおい、じゅうぶんに光を当てた。葉の部分A〜Dのうち、光が当たるが葉緑体がない部分を選びなさい。",a:"C",o:[["C",1],["A",0],["B",0],["D",0]],e:"裏3番。ふの部分でアルミはくの外＝C。「葉緑体が必要」を示す比較相手。"},
  {n:"裏4",q:"植物が光を受けて、デンプンなどの栄養分をつくり出すはたらきを何というか。",a:"光合成",o:[["光合成",1],["呼吸",0],["蒸散",0],["消化",0]],e:"裏4番。「光合成」の3文字。"},
];

/* セット2：言い換え・逆問い */
const QS2 = [
  {n:"言い換え",q:"根からの水の通り道と、葉でできた養分の通り道の組み合わせで正しいのは？",a:"水＝道管、養分＝師管",o:[["水＝道管、養分＝師管",1],["水＝師管、養分＝道管",0],["どちらも道管",0],["どちらも師管",0]],e:"「水は道を通る」で固定。"},
  {n:"言い換え",q:"道管と師管が集まった束を何というか。",a:"維管束",o:[["維管束",1],["神経束",0],["葉脈",0],["気孔",0]],e:"維管束。葉では葉脈として見える。"},
  {n:"言い換え",q:"気孔を囲んでいる三日月形の細胞を何というか。",a:"孔辺細胞",o:[["孔辺細胞",1],["表皮細胞",0],["柔毛",0],["葉緑体",0]],e:"孔辺細胞。プリント4番の文中に出ている語。逆に問われても答えられるように。"},
  {n:"言い換え",q:"気孔はふつう葉のどちら側に多いか。",a:"裏側",o:[["裏側",1],["表側",0],["両側同じ",0],["茎の中",0]],e:"裏側に多い。蒸散の実験（ワセリン）で問われる定番。"},
  {n:"言い換え",q:"蒸散が主に行われる場所はどこか。",a:"気孔",o:[["気孔",1],["道管",0],["根毛",0],["葉緑体",0]],e:"水蒸気の出口＝気孔。"},
  {n:"逆問い",q:"「蒸散」の説明として正しいものは？（記述では一文で説明）",a:"植物の体から水が水蒸気となって出ていく現象",o:[["植物の体から水が水蒸気となって出ていく現象",1],["根から水を吸い上げる現象",0],["葉で養分をつくる現象",0],["酸素をとり入れて二酸化炭素を出す現象",0]],e:"プリント5番の逆。"},
  {n:"言い換え",q:"トウモロコシやイネのように、茎の維管束が散らばっている植物のなかまは？",a:"単子葉類",o:[["単子葉類",1],["双子葉類",0],["裸子植物",0],["シダ植物",0]],e:"単子葉類＝散在・ひげ根・平行脈。"},
  {n:"言い換え",q:"ホウセンカやアサガオのように、茎の維管束が輪の形に並ぶ植物のなかまは？",a:"双子葉類",o:[["双子葉類",1],["単子葉類",0],["裸子植物",0],["コケ植物",0]],e:"双子葉類＝輪状・主根と側根・網状脈。"},
  {n:"言い換え",q:"ふ入りのアサガオの実験で「光合成には光が必要」を示すには、どの2つを比べればよいか。",a:"AとB",o:[["AとB（緑・光あり vs 緑・光なし）",1],["AとC（緑・光あり vs ふ・光あり）",0],["BとD",0],["CとD",0]],e:"「光」だけが違う2つ＝AとB。葉緑体の条件はそろえる（対照実験の考え方）。"},
  {n:"言い換え",q:"ふ入りのアサガオの実験で「光合成には葉緑体が必要」を示すには、どの2つを比べればよいか。",a:"AとC",o:[["AとC（緑・光あり vs ふ・光あり）",1],["AとB（緑・光あり vs 緑・光なし）",0],["BとD",0],["AとD",0]],e:"「葉緑体」だけが違う2つ＝AとC。光の条件はそろえる。"},
  {n:"言い換え",q:"この実験でヨウ素液をつけたとき、青紫色になる部分はどこか。",a:"A",o:[["A",1],["B",0],["C",0],["D",0]],e:"デンプンができた所＝光合成した所＝A。"},
  {n:"逆問い",q:"光合成でつくられる栄養分と、必要な条件の組み合わせは？",a:"デンプンなど／光と葉緑体",o:[["デンプンなど／光と葉緑体",1],["酸素／水と温度",0],["タンパク質／光と水",0],["二酸化炭素／葉緑体のみ",0]],e:"つくる＝デンプンなど（＋酸素が出る）。条件＝光・葉緑体（材料＝水と二酸化炭素）。"},
];

/* セット3：図と関係・分類 */

  {n:"図",fig:"cross",q:"茎の断面のAは道管と師管のどちらか。",a:"道管",o:[["道管",1],["師管",0],["気孔",0],["葉緑体",0]],e:"赤い水で染まったA＝道管。プリントの図ではAが道管の位置。"},
  {n:"図",fig:"cross",q:"茎の断面のBは道管と師管のどちらか。",a:"師管",o:[["師管",1],["道管",0],["形成層",0],["根毛",0]],e:"染まらなかったB＝師管。"},
  {n:"図",fig:"cross",q:"葉の断面のCは道管と師管のどちらか。",a:"道管",o:[["道管",1],["師管",0],["気孔",0],["表皮",0]],e:"葉の維管束は【表側が道管・裏側が師管】。"},
  {n:"図",fig:"cross",q:"葉の断面のDは道管と師管のどちらか。",a:"師管",o:[["師管",1],["道管",0],["孔辺細胞",0],["葉脈",0]],e:"裏側＝師管。表8番で「A、C」になる理由がこれ。"},
  {n:"図",fig:"cross",q:"この茎の断面の植物は、単子葉類と双子葉類のどちらか。",a:"双子葉類",o:[["双子葉類（維管束が輪）",1],["単子葉類（維管束が散在）",0],["裸子植物",0],["判断できない",0]],e:"維管束が輪の形＝双子葉類。"},
  {n:"図",fig:"asagao",q:"図のA〜Dのうち、「葉緑体あり・光あり」の部分はどれか。",a:"A",o:[["A",1],["B",0],["C",0],["D",0]],e:"緑でアルミはくの外＝A。ここだけ光合成が起こる。"},
  {n:"図",fig:"asagao",q:"図のA〜Dのうち、「葉緑体なし・光なし」の部分はどれか。",a:"D",o:[["D",1],["A",0],["B",0],["C",0]],e:"ふの部分でアルミはくの下＝D。どちらの条件も欠けている。"},
  {n:"図",fig:"asagao",q:"図のA〜Dを「光合成が起こる／起こらない」で分けると？",a:"起こる＝A、起こらない＝B・C・D",o:[["起こる＝A、起こらない＝B・C・D",1],["起こる＝A・B、起こらない＝C・D",0],["起こる＝A・C、起こらない＝B・D",0],["すべて起こる",0]],e:"光と葉緑体の両方がそろうAだけ。"},
  {n:"分類",q:"単子葉類の特徴の組み合わせとして正しいのは？",a:"維管束が散在・ひげ根・平行脈",o:[["維管束が散在・ひげ根・平行脈",1],["維管束が輪・主根と側根・網状脈",0],["維管束が散在・主根と側根・網状脈",0],["維管束が輪・ひげ根・平行脈",0]],e:"単子葉類＝散在・ひげ根・平行脈（トウモロコシ）。双子葉類＝輪・主根側根・網状脈（ホウセンカ）。"},
  {n:"分類",q:"次のうち双子葉類はどれか。",a:"ホウセンカ",o:[["ホウセンカ",1],["トウモロコシ",0],["イネ",0],["ユリ",0]],e:"ホウセンカ・アサガオ・ヒマワリ＝双子葉類。トウモロコシ・イネ・ユリ＝単子葉類。"},
  {n:"分類",q:"植物の体の中で「水」がたどる順番として正しいのは？",a:"根→道管→葉→気孔（蒸散）",o:[["根→道管→葉→気孔（蒸散）",1],["葉→師管→根→気孔",0],["気孔→道管→根",0],["根→師管→葉→気孔",0]],e:"根で吸収→道管を上る→葉→気孔から水蒸気として出る（蒸散）。"},
  {n:"分類",q:"「葉でつくられた養分」がたどる順番として正しいのは？",a:"葉（光合成）→師管→体の各部",o:[["葉（光合成）→師管→体の各部",1],["根→道管→葉",0],["気孔→師管→根",0],["葉→道管→根",0]],e:"養分は師管で全身へ。"},
];

const SETS = {
  s1:{title:"セット1：プリントそのまま（選択式）",emo:"📄",sub:"本番と同じ両面12問を4択で（順番シャッフル）",qs:QS1,write:false},
  s2:{title:"セット2：言い方を変えて・逆から（選択式）",emo:"🔁",sub:"別の問い方・実験の比較・用語→説明（12問）",qs:QS2,write:false},
  s3:{title:"セット3：図と関係（選択式）",emo:"🌿",sub:"断面図のA〜D・アサガオのA〜D・単子葉/双子葉の分類（12問）",qs:QS3,write:false},
  s4:{title:"セット4：記述（本番形式）",emo:"✍️",sub:"プリントの12問を紙に漢字で書いて自己採点。✗ゼロがゴール",qs:QS1,write:true},
};
const $=id=>document.getElementById(id);
let state={};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bestKey(s){return "kotest_rika_shokubutsu_"+s;}
function renderHome(){
  $("home").classList.remove("hidden");$("quiz").classList.add("hidden");$("result").classList.add("hidden");
  const list=$("modeList");list.innerHTML="";
  for(const s in SETS){const st=SETS[s];const best=localStorage.getItem(bestKey(s));
    const b=document.createElement("button");b.className="mode";
    b.innerHTML=`<span class="emo">${st.emo}</span><span class="tt"><b>${st.title}</b><small>${st.sub}</small></span>${best?`<span class="best">最高 ${best}%</span>`:""}`;
    b.onclick=()=>start(s);list.appendChild(b);}
}
function start(set,subset){
  const qs=subset?subset:SETS[set].qs.slice();
  state={set,items:shuffle(qs),pos:0,score:0,wrong:[]};
  $("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  $("modeName").textContent=SETS[set].emo+" "+SETS[set].title;
  renderQ();
}
function renderQ(){
  const it=state.items[state.pos];const w=SETS[state.set].write;
  $("count").textContent=`${state.pos+1} / ${state.items.length}`;
  $("prog").style.width=(state.pos/state.items.length*100)+"%";
  $("qtag").textContent="第"+(state.pos+1)+"問（"+(typeof it.n==="number"?"プリント"+it.n+"番":it.n)+"）";
  $("qText").textContent=it.q;
  $("figBox").innerHTML=it.fig?FIGS[it.fig]:"";
  $("exp").className="exp";$("exp").innerHTML="";$("nextBtn").classList.add("hidden");
  const box=$("opts");box.innerHTML="";
  if(w){
    box.classList.add("hidden");$("writeArea").classList.remove("hidden");
    $("ansBox").classList.add("hidden");$("revealBtn").classList.remove("hidden");
    $("ansText").textContent=it.a;
  }else{
    box.classList.remove("hidden");$("writeArea").classList.add("hidden");
    shuffle(it.o).forEach(op=>{const b=document.createElement("button");b.className="opt";b.textContent=op[0];b.onclick=()=>answer(b,op[1]===1,it);box.appendChild(b);});
  }
  window.scrollTo(0,0);
}
function correctText(it){return it.o.find(o=>o[1]===1)[0];}
function finish(correct,it){
  if(correct)state.score++;else state.wrong.push(it);
  const exp=$("exp");exp.innerHTML=`<span class="res ${correct?'y':'n'}">${correct?'⭕ 正解！':'❌ ここを復習'}</span>${it.e}`;
  exp.classList.add("show");$("nextBtn").classList.remove("hidden");
}
function answer(btn,correct,it){
  $("opts").querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===correctText(it))b.classList.add("correct");});
  if(!correct)btn.classList.add("wrong");
  finish(correct,it);
}
$("revealBtn").onclick=()=>{$("revealBtn").classList.add("hidden");$("ansBox").classList.remove("hidden");};
$("selfOk").onclick=()=>{$("ansBox").classList.add("hidden");finish(true,state.items[state.pos]);};
$("selfNg").onclick=()=>{$("ansBox").classList.add("hidden");finish(false,state.items[state.pos]);};
$("nextBtn").onclick=()=>{state.pos++;if(state.pos>=state.items.length)renderResult();else renderQ();};
function renderResult(){
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  const total=state.items.length,sc=state.score,pct=Math.round(sc/total*100);
  $("scoreNum").textContent=`${sc} / ${total}`;$("scorePct").textContent=`正答率 ${pct}%`;
  let ring,msg;
  if(pct===100){ring="🎉";msg="全問正解！明日はこの調子で満点！";}
  else if(pct>=75){ring="💪";msg="あと少し！まちがえた問題だけもう1周";}
  else{ring="📖";msg="解説を読んで、書けなかった用語を3回書こう";}
  $("ring").textContent=ring;$("resMsg").textContent=msg;
  if(state.items.length===SETS[state.set].qs.length){
    const prev=parseInt(localStorage.getItem(bestKey(state.set))||"0");
    if(pct>prev)localStorage.setItem(bestKey(state.set),pct);
    if(typeof reportUnit==="function")reportUnit("🌿 理科 小テスト対策（植物の体のつくり）："+SETS[state.set].title+"\n"+total+"問 → "+sc+"問正解（"+pct+"%）\n"+(pct===100?"🎉 全問正解！":"あと少し！復習します💪")+"\n#莉映の小テスト対策");
  }
  const rw=$("retryWrong");
  if(state.wrong.length>0){rw.classList.remove("hidden");$("wrongN").textContent=state.wrong.length;rw.onclick=()=>start(state.set,state.wrong.slice());}
  else rw.classList.add("hidden");
}
$("againBtn").onclick=()=>start(state.set);
$("homeBtn").onclick=renderHome;
$("quitBtn").onclick=()=>{if(confirm("モード一覧に戻りますか？"))renderHome();};
renderHome();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アウトプット練習｜書く・言う</title>
<style>
  :root{
    --bg:#f3fbf6; --card:#ffffff; --ink:#1f2733; --sub:#6b7686;
    --accent:#0e9f6e; --accent-d:#0a7a54;
    --ok:#16a34a; --ok-bg:#dcfce7; --mid:#d97706; --mid-bg:#fef3c7; --ng:#dc2626; --ng-bg:#fee2e2;
    --line:#dceee5; --shadow:0 4px 14px rgba(10,80,50,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; font-size:17px;
    padding:14px 12px 40px; max-width:480px; margin:0 auto;
  }
  h1{font-size:20px; margin:6px 0 2px; text-align:center;}
  .lead{text-align:center; color:var(--sub); font-size:13px; margin:0 0 14px;}
  .backlink{display:inline-block; margin-bottom:6px; color:var(--accent); text-decoration:none; font-weight:700; font-size:14px;}
  .card{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:16px; margin-bottom:14px;}
  .topic{
    display:flex; align-items:center; gap:12px; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; text-align:left;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .08s;
  }
  .topic:active{transform:scale(.98);}
  .topic .emo{font-size:24px; flex:0 0 auto; width:30px; text-align:center;}
  .topic .tt{flex:1 1 auto;}
  .topic .tt b{font-size:15px; display:block;}
  .topic .tt small{color:var(--sub); font-size:11.5px;}
  .topic .rate{font-size:11px; color:var(--accent); font-weight:800; flex:0 0 auto; text-align:right;}
  .arrow{color:var(--accent); font-weight:700;}
  .section-t{font-size:13px; font-weight:800; color:var(--sub); margin:14px 4px 8px;}
  .bar{height:8px; background:#e3f1ea; border-radius:99px; overflow:hidden; margin:6px 0;}
  .bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s;}
  .meta{display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:10px;}
  .modebadge{display:inline-block; font-size:12px; font-weight:800; border-radius:7px; padding:3px 10px; margin-bottom:12px;}
  .modebadge.write{color:#0a7a54; background:#dcfce7;}
  .modebadge.speak{color:#9a3412; background:#ffedd5;}
  .prompt{font-size:20px; font-weight:700; margin:2px 0 14px; line-height:1.5;}
  .instr{font-size:13px; color:var(--sub); background:#f0f8f4; border-radius:10px; padding:10px 12px; margin-bottom:12px;}
  .answer{display:none; border-top:1px dashed var(--line); margin-top:6px; padding-top:12px;}
  .answer.show{display:block;}
  .answer .alab{font-size:12px; font-weight:800; color:var(--accent);}
  .answer .atext{font-size:21px; font-weight:800; margin:4px 0 8px; line-height:1.5; word-break:break-word;}
  .answer .exp{font-size:14px; color:#334; background:#f0f8f4; border-left:4px solid var(--accent); border-radius:8px; padding:10px 12px;}
  .grade{display:flex; gap:8px; margin-top:14px;}
  .grade button{flex:1; border:2px solid; border-radius:12px; padding:13px 4px; font-size:15px; font-weight:800; background:#fff; cursor:pointer;}
  .g-ok{color:var(--ok); border-color:var(--ok);}
  .g-mid{color:var(--mid); border-color:var(--mid);}
  .g-ng{color:var(--ng); border-color:var(--ng);}
  .grade button:active{transform:scale(.97);}
  .btn{
    display:block; width:100%; background:var(--accent); color:#fff; border:none;
    border-radius:12px; padding:15px; font-size:17px; font-weight:700; cursor:pointer;
    margin-top:6px; box-shadow:var(--shadow);
  }
  .btn:active{background:var(--accent-d);}
  .btn.ghost{background:#fff; color:var(--accent); border:2px solid var(--accent); box-shadow:none;}
  .btn.gray{background:#eef3f0; color:var(--sub); box-shadow:none;}
  .btn.line{background:#06c755;}
  .btn.line:active{background:#05a445;}
  .hidden{display:none;}
  .foot{text-align:center; color:var(--sub); font-size:11px; margin-top:16px;}
  /* dashboard */
  .dash-row{margin-bottom:14px;}
  .dash-row .top{display:flex; justify-content:space-between; align-items:baseline;}
  .dash-row .nm{font-size:14px; font-weight:700;}
  .dash-row .pc{font-size:13px; font-weight:800; color:var(--accent);}
  .pills{display:flex; gap:8px; font-size:11.5px; color:var(--sub); margin-top:2px;}
  .pill b{font-weight:800;}
  .pill.ok b{color:var(--ok);} .pill.mid b{color:var(--mid);} .pill.ng b{color:var(--ng);}
  .big-rate{text-align:center; font-size:15px; color:var(--sub); margin:2px 0 4px;}
  .big-rate .num{font-size:44px; font-weight:800; color:var(--accent); display:block; line-height:1;}
</style>
<script src="report.js"></script>
</head>
<body>

<!-- HOME -->
<div id="home">
  <a class="backlink" id="homeBack" href="index.html">← 科目をえらぶ</a>
  <h1 id="homeTitle">✍️ アウトプット練習</h1>
  <p class="lead">書いて・言って答える「再生」トレーニング<br>クイズで覚えた知識を“出せる”か確かめよう</p>

  <div class="card">
    <div class="big-rate"><span class="num" id="homeRate">0%</span><span id="homeRateLab">ぜんたいの習得率（✓のわりあい）</span></div>
    <div class="bar"><i id="homeBar"></i></div>
    <button class="btn" id="checkBtn">📊 習得状況をくわしく見る（CHECK）</button>
  </div>

  <div class="section-t" id="writeSec">✏️ 書いて答える（ノートに書く）</div>
  <div id="writeList"></div>
  <div class="section-t" id="speakSec">🗣️ 口で答える（声に出して説明）</div>
  <div id="speakList"></div>

  <p class="foot">※自己採点した記録はこのスマホに保存されます。<br>「もう一度」が0になればテスト範囲はバッチリ！</p>
</div>

<!-- PRACTICE -->
<div id="practice" class="hidden">
  <div class="card">
    <div class="meta"><span id="deckName"></span><span id="count"></span></div>
    <span class="modebadge" id="modeBadge"></span>
    <p class="prompt" id="promptText"></p>
    <div class="instr" id="instrText"></div>
    <button class="btn" id="revealBtn">答えを見る 👀</button>
    <div class="answer" id="answer">
      <span class="alab">こたえ</span>
      <div class="atext" id="aText"></div>
      <div class="exp" id="aExp"></div>
      <p style="font-size:13px;color:#6b7686;margin:14px 2px 0;font-weight:700;">自分で採点しよう👇</p>
      <div class="grade">
        <button class="g-ok"  id="gOk">✓ 完璧</button>
        <button class="g-mid" id="gMid">△ おしい</button>
        <button class="g-ng"  id="gNg">✗ もう一度</button>
      </div>
    </div>
  </div>
  <button class="btn gray" id="quitBtn">やめて一覧へ</button>
</div>

<!-- RESULT -->
<div id="result" class="hidden">
  <div class="card">
    <div class="big-rate"><span class="num" id="resNum"></span></div>
    <div class="msg" id="resMsg" style="text-align:center;font-weight:700;margin-bottom:12px;"></div>
    <button class="btn ghost hidden" id="redoWeak">△✗だけ もう一度（<span id="weakN"></span>）</button>
    <button class="btn" id="redoAll">この範囲をもう一度</button>
    <button class="btn gray" id="toHome1">一覧へ</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="hidden">
  <a class="backlink" id="dashBack" href="#">← もどる</a>
  <h1>📊 習得状況（CHECK）</h1>
  <p class="lead">親子で確認用。✓完璧／△おしい／✗もう一度</p>
  <div class="card">
    <div class="big-rate"><span class="num" id="dashRate"></span>ぜんたいの習得率</div>
    <div class="bar"><i id="dashBar"></i></div>
  </div>
  <div class="card" id="dashList"></div>
  <button class="btn gray" id="resetBtn">記録をリセット</button>
</div>

  rika2_write: { title:"生物：用語と記述（考察の型）", emo:"🌱", mode:"write", subj:"理科", cards:[
    {q:"生物の体をつくる最小単位を漢字で書け。", a:"細胞", e:"「胞」の字に注意。細胞→組織→器官→個体。"},
    {q:"植物の細胞だけにあるつくりを3つ漢字で書け。", a:"細胞壁・葉緑体・液胞", e:"「壁」「緑」「液」——3つとも書けるように。"},
    {q:"形やはたらきが同じ細胞の集まりを何というか。漢字で書け。", a:"組織", e:"組織が集まると器官（胃・葉など）。"},
    {q:"光合成を式で書け（言葉の式）。", a:"水＋二酸化炭素 →（光・葉緑体）→ デンプンなど＋酸素", e:"材料2つ・できるもの2つ・条件（光、葉緑体で）をセットで。"},
    {q:"【記述】光合成の実験で「対照実験」を行う理由を書け。", a:"調べたい条件以外を同じにして結果を比較することで、その条件が原因だと確かめるため。", e:"採点ポイント：①条件以外を同じに ②比較して確かめる。実験レポートの考察でそのまま使える型。"},
    {q:"根から吸収した水が通る管と、葉でつくられた養分が通る管をそれぞれ漢字で書け。", a:"水＝道管、養分＝師管", e:"「水は道を通る」。2つの束＝維管束も書けるように。"},
    {q:"【記述】蒸散の実験で、葉の裏にワセリンをぬったものが最も水が減らなかった。この結果からわかることを書け。", a:"気孔は葉の裏側に多くあり、蒸散は主に気孔で行われていること。", e:"採点：①気孔は裏に多い ②蒸散は気孔で起こる。「結果→わかること」の順で書く。"},
    {q:"だ液にふくまれる消化酵素の名前をカタカナで書け。", a:"アミラーゼ", e:"デンプンを分解。胃液はペプシン。"},
    {q:"【記述】だ液の実験を約40℃の湯で行う理由を書け。", a:"ヒトの体温に近い温度にして、だ液（消化酵素）がよくはたらく条件にするため。", e:"採点：①体温に近い ②酵素がはたらきやすい。"},
    {q:"デンプン・タンパク質・脂肪が最終的に分解されてできる物質をそれぞれ書け。", a:"デンプン→ブドウ糖、タンパク質→アミノ酸、脂肪→脂肪酸とモノグリセリド", e:"3セットを表で覚える。脂肪だけ2つできる。"},
    {q:"【記述】小腸の柔毛や肺の肺胞がたくさんある利点を書け。", a:"表面積が大きくなり、養分の吸収（気体の交換）を効率よく行えるから。", e:"「表面積を大きくして効率よく○○」——柔毛・肺胞・根毛に共通の万能記述。"},
    {q:"【記述】ヘモグロビンの性質を「酸素」という語を使って書け。", a:"酸素の多いところでは酸素と結びつき、酸素の少ないところでは酸素をはなす性質。", e:"採点：①多いところで結びつく ②少ないところではなす。この性質で肺から全身へ酸素を運べる。"},
    {q:"有害なアンモニアを尿素に変える器官と、尿素をこしとる器官をそれぞれ漢字で書け。", a:"変える＝肝臓、こしとる＝じん臓", e:"肝臓（変換工場）→じん臓（ろ過装置）→ぼうこう。"},
    {q:"【記述】反射が意識的な反応よりも速い理由を書け。", a:"信号が脳を通らず、せきずいから直接命令が出されるから。", e:"採点：①脳を通らない ②せきずいが命令。「危険から体を守るのに役立つ」も加点要素。"},
    {q:"うでを曲げるとき、内側と外側の筋肉はそれぞれどうなるか書け。", a:"内側の筋肉は縮み、外側の筋肉はゆるむ。", e:"筋肉は対（ペア）ではたらく。のばすときは逆になる。"},
  ]},
  kanji2_write: { title:"漢字書き（漢字ノート⑦〜⑯）", emo:"✏️", mode:"write", subj:"国語", cards:[
    {q:"【書き】カフクを占う。", a:"禍福", e:"単元⑦（ノートp.14）。しめすへんの「禍」。"},
    {q:"【書き】ケイチョウ用の礼服。", a:"慶弔", e:"単元⑦。お祝い（慶）とお悔やみ（弔）。"},
    {q:"【書き】ノウム注意報が出る。", a:"濃霧", e:"単元⑧（p.16）。「霧」は雨かんむり＋務。"},
    {q:"【書き】チツジョを守る。", a:"秩序", e:"単元⑧。「秩」はのぎへん。"},
    {q:"【書き】ダトウな判断だ。", a:"妥当", e:"単元⑧。"},
    {q:"【書き】音楽をカンショウする。", a:"鑑賞", e:"単元⑩（p.20）。芸術は「鑑賞」、風景・植物は「観賞」——同音異義語のひっかけ注意。"},
    {q:"【書き】ミリョクを感じる。", a:"魅力", e:"単元⑩。「魅」は鬼がまえ。"},
    {q:"【書き】伝言をタクす。", a:"託す", e:"単元⑩。ごんべん。『モアイは語る』の「モアイは託す」でも出る字。"},
    {q:"【書き】ジッセンする。", a:"実践", e:"単元⑪（p.22）。「践」を「銭」と書かない。"},
    {q:"【書き】抽象的なガイネン。", a:"概念", e:"単元⑪。きへんの「概」。"},
    {q:"【書き】日程をケイジする。", a:"掲示", e:"単元⑪。てへんの「掲」。"},
    {q:"【書き】アイマイな返事をする。", a:"曖昧", e:"単元⑫（p.24）。どちらも「日」がつく。書き最頻出クラス。"},
    {q:"【書き】コンキョを示す。", a:"根拠", e:"単元⑫。『モアイは語る』の学習用語（根拠を吟味）と直結。"},
    {q:"【書き】新聞にトウコウする。", a:"投稿", e:"単元⑫。のぎへんの「稿」。"},
    {q:"【書き】キンチョウをほぐす。", a:"緊張", e:"単元⑬（p.26）。「緊」は糸が下。"},
    {q:"【書き】キオクに残る。", a:"記憶", e:"単元⑬。りっしんべんの「憶」。「億」と区別。"},
    {q:"【書き】フンイキがよい。", a:"雰囲気", e:"単元⑭（p.28）。雨かんむりの「雰」。"},
    {q:"【書き】大会をカイサイする。", a:"開催", e:"単元⑭。にんべんの「催」。"},
    {q:"【書き】田舎にソカイする。", a:"疎開", e:"単元⑮（p.30）。『字のない葉書』の中心語。"},
    {q:"【書き】ミシンでぬう。", a:"縫う", e:"単元⑮。いとへん。「肌着（はだぎ）」「雑炊（ぞうすい）」も同単元。"},
    {q:"【書き】ケンジョウの美徳。", a:"謙譲", e:"単元⑯（p.32）。ごんべんが2つ並ぶ。敬語の単元と直結。"},
    {q:"【書き】お手紙をハイケンする。", a:"拝見", e:"単元⑯。「拝」の横棒は4本。"},
  ]},

  kokugo2_say: { title:"国語2学期：記述（説明する）", emo:"📖", mode:"speak", subj:"国語", cards:[
    {q:"短歌の形式を説明して。", a:"五・七・五・七・七の三十一音で表す定型詩。音数が多いものを字余り、少ないものを字足らずという。", e:"採点：①五七五七七 ②三十一音。字余り・字足らずまで言えれば完璧。"},
    {q:"『言葉の力』で、筆者が桜色の糸の話から考えた「言葉の本質」を説明して。", a:"花びらのピンクが木全体の活動の表れであるように、言葉も口先だけのものではなく、発する人間全体の世界を背負っているということ。", e:"採点：①桜＝木全体（全身） ②言葉＝人間全体が反映される、の対応関係。"},
    {q:"『字のない葉書』で、父が娘への手紙に「殿」や時候の挨拶を使った理由を説明して。", a:"暴君だが照れ性でもあった父は、他人行儀という形でしか十三歳の娘に手紙が書けなかったから。", e:"採点：①照れ性 ②他人行儀という形でしか書けない。「日頃演じられない父親を手紙の中でやってみた」も可。"},
    {q:"『字のない葉書』で、葉書のマルの変化が表しているものを説明して。", a:"赤鉛筆の大マルから小マル、バツへの変化は、疎開先での妹の元気が失われていく様子を表している。", e:"採点：①マル→バツの変化 ②妹の元気・健康状態の悪化。"},
    {q:"尊敬語と謙譲語の違いを説明して。", a:"尊敬語は動作をする人を高めて敬意を表す。謙譲語は自分や身内の行為をへりくだり、行為の向かう先に敬意を表す。", e:"採点：①誰を高めるか（動作をする人／行為の向かう先）の対比。例：いらっしゃる／伺う。"},
    {q:"『モアイは語る』で、文明崩壊までの流れを順に説明して。", a:"森の消滅によって表層土壌が雨で流失し、食料危機に直面して部族間の抗争が頻発し、十七世紀後半から十八世紀前半に文明が崩壊した。", e:"採点：①森の消滅（根本的原因） ②土壌流失→食料危機 ③抗争→崩壊、の因果の順序。"},
    {q:"『モアイは語る』で、筆者がイースター島と地球の共通点として述べていることを説明して。", a:"どちらも周りから食料を運んでくることができない「絶海の孤島」であり、森を破壊し尽くせば同じ飢餓に直面するという点。", e:"採点：①孤島＝地球（宇宙に浮かぶ島） ②森の破壊→飢餓。だから有限の資源を長期的に利用すべきという主張につながる。"},
    {q:"『モアイは語る』の筆者の主張を一文で言って。", a:"有限の資源をできるだけ効率よく、長期にわたって利用する方策を考えることが、人類の生き延びる道である。", e:"採点：①有限の資源 ②効率よく・長期にわたって利用。「森林は文明を守る生命線」も加点要素。"},
  ]},
  rekishi2_say: { title:"歴史2学期：記述（説明する）", emo:"🏯", mode:"speak", subj:"歴史", cards:[
    {q:"太閤検地と刀狩によって社会はどう変わったか説明して。", a:"武士と百姓の身分の区別が明確になり（兵農分離）、身分に対応した職業で生活する近世社会の仕組みができた。", e:"採点：①兵農分離という語 ②身分の区別が明確になった、の2点。"},
    {q:"参勤交代が大名にあたえた影響を説明して。", a:"1年おきの江戸との往復の費用や江戸での生活費が藩の大きな負担となり、大名の経済力をおさえることになった。", e:"採点：①費用の負担 ②大名の力をおさえる効果。"},
    {q:"江戸幕府が「鎖国」をした理由を説明して。", a:"キリスト教の禁止を徹底するためと、貿易の利益を幕府が独占するため。", e:"採点：①キリスト教禁止（島原・天草一揆が背景） ②貿易統制、の2点セット。"},
    {q:"江戸幕府の支配が約260年も続いた理由を、大名統制の面から説明して。", a:"武家諸法度や参勤交代で大名を厳しく統制し、親藩・譜代・外様の配置を工夫して幕府に反抗できない仕組みを作ったから。", e:"採点：①武家諸法度・参勤交代 ②大名の配置。単元の学習課題そのもの。"},
    {q:"元禄文化と化政文化の特色の違いを、担い手に着目して説明して。", a:"元禄文化は上方（大阪・京都）の経済力のある町人が担い手、化政文化は江戸の庶民が担い手となった文化である。", e:"採点：①元禄＝上方の町人 ②化政＝江戸の庶民。場所と担い手の対比。"},
    {q:"「天下の台所」とよばれた大阪の役割を説明して。", a:"全国の商業の中心地で、諸藩が蔵屋敷を置いて年貢米や特産物を売りさばいた。", e:"採点：①商業の中心 ②蔵屋敷。"},
  ]},
  chiri2_say: { title:"地理2学期：記述（説明する）", emo:"🗾", mode:"speak", subj:"地理", cards:[
    {q:"促成栽培を行う理由を「価格」という語を使って説明して。", a:"ほかの産地からの出荷が少なく、価格が高い時期に出荷して高く売るため。", e:"採点：①出荷時期をずらす ②価格が高い時期に売る。宮崎平野のピーマン・きゅうりなど。"},
    {q:"再生可能エネルギーの利点と課題をそれぞれ説明して。", a:"利点は、二酸化炭素をほとんど出さず、資源を輸入に頼らないこと。課題は、発電量が天候に左右され、コストが高いこと。", e:"採点：利点・課題を1つずつ。利点だけ・課題だけの解答は減点される。"},
    {q:"シラス台地で畜産や畑作が盛んになった理由を説明して。", a:"シラス台地は水を通しやすく稲作に不向きだったが、ダムや農業用水の整備で水が得られるようになり、畑作や畜産が発展した。", e:"採点：①水を通しやすく稲作に不向き ②用水整備後に畑作・畜産、の流れ。"},
    {q:"八幡製鉄所が北九州に作られた理由を説明して。", a:"鉄鋼の製造に必要な石炭が筑豊炭田で採れ、鉄鉱石の輸入先の中国にも近く、原料の調達に便利だったから。", e:"採点：①石炭（筑豊炭田） ②中国からの鉄鉱石。位置関係で答える。"},
    {q:"産業の空洞化とは何か説明して。", a:"企業が人件費の安い海外に工場を移すことで、国内の生産が衰退すること。", e:"採点：①海外移転 ②国内生産の衰退。"},
    {q:"沖縄県で第3次産業の割合が高い理由を説明して。", a:"温暖な気候やさんご礁の海など豊かな自然を生かした観光業が盛んだから。", e:"採点：①自然・気候 ②観光業。"},
  ]},
  kokugo_say: { title:"国語の記述（説明する）", emo:"🗣️", mode:"speak", subj:"国語", cards:[
    {q:"「僕」がぐうちゃんの話を信じるようになったきっかけを説明して。", a:"手紙に入っていたナマズとアイスプラネット（氷山）の写真を見て、ぐうちゃんの話がほら話ではなく本当だったとわかったから。", e:"採点ポイント：①手紙の写真 ②ほら話だと思っていた→本当だった、の2点。"},
    {q:"ぐうちゃんが手紙で「僕」に伝えたかったことは？", a:"本をたくさん読んで「不思議アタマ」をいっぱいにして、いつか自分の目で世界を確かめてほしいということ。", e:"採点：①本を読む／好奇心 ②自分の目で確かめる、の2点。"},
    {q:"詩『見えないだけ』の主題（作者が伝えたいこと）を一言で。", a:"今は見えなくても、希望や新しい出会いは確かに存在しているということ。", e:"採点：「見えない＝無い」ではない、という前向きな主題。"},
    {q:"枕草子「秋は夕暮れ」がよいとされる情景を説明して。", a:"夕日がさして、烏や雁が連れ立って飛び急ぐ様子。日が沈んでからの風の音や虫の音にも趣がある。", e:"採点：①夕日と鳥の視覚 ②日没後の風・虫の音（聴覚）。"},
    {q:"クマゼミが梅雨の時期に孵化すると有利な理由を40字程度で。", a:"雨で土が軟らかく湿り、乾燥に弱い幼虫が土に潜りやすくなるから。", e:"採点：①土が軟らかく湿る ②幼虫が潜りやすい。字数を意識して言おう。"},
    {q:"筆者がクマゼミ増加の原因として結論づけたことを説明して。", a:"都市化（ヒートアイランドで孵化が早まり梅雨に重なること、硬い土でも潜れる能力があること）が複数重なって増えたと考えた。", e:"採点：①都市化 ②原因は一つでなく複数。"},
    {q:"古語「をかし」と「あはれ」の感じ方のちがいを説明して。", a:"「をかし」は明るく知的に趣を感じること。「あはれ」はしみじみと深く心に感じること。", e:"採点：をかし＝明るい・知的、あはれ＝しみじみ・情緒。"},
    {q:"クマゼミの説明文で、筆者が大切だと述べた研究の姿勢は？", a:"簡単に結びつけず、実験や観察を重ねて科学的な根拠を一歩一歩積み上げていく姿勢。", e:"採点：①科学的根拠 ②一歩ずつ／決めつけない。"},
  ]},
  rekishi_say: { title:"歴史の記述（説明する）", emo:"🗣️", mode:"speak", subj:"歴史", cards:[
    {q:"元（モンゴル）が二度せめてきた戦いをまとめて何という？理由も一言で。", a:"元寇（文永の役・弘安の役）。フビライ＝ハンの服属要求を、執権の北条時宗が断ったため。", e:"採点：①元寇（2回の名前）②時宗が拒否。"},
    {q:"元寇のあと、御家人が幕府に不満をもった理由を説明して。", a:"命がけで戦ったのに、恩賞（領地）が十分にもらえず、生活が苦しくなったから。", e:"採点：①防衛戦で領地が増えない ②恩賞不足で困窮。"},
    {q:"室町幕府を開いた人物と、3代将軍が成しとげたことを説明して。", a:"足利尊氏が開いた。3代義満が南北朝を統一し、明との勘合貿易を始めた。", e:"採点：①尊氏 ②義満・南北朝統一／勘合貿易。"},
    {q:"勘合貿易で「勘合」という合い札を使った理由は？", a:"正式な貿易船と、海賊である倭寇を区別するため。", e:"採点：倭寇との区別。"},
  ]},
  chiri_say: { title:"地理の記述（説明する）", emo:"🗣️", mode:"speak", subj:"地理", cards:[
    {q:"ブラジルがさかんに生産する、さとうきびから作るバイオ燃料は？特徴も。", a:"バイオエタノール（バイオ燃料）。植物が育つときCO₂を吸うため、燃やしてもCO₂を増やしにくいとされる。", e:"採点：①バイオエタノール ②CO₂を増やしにくい。"},
    {q:"かつてオーストラリアがとっていた、白人以外の移民を制限する政策は？今は？", a:"白豪主義。現在は多くの民族の文化を尊重する多文化主義（多文化社会）へ変わった。", e:"採点：①白豪主義 ②多文化主義へ転換。"},
    {q:"冬に日本海側で大雪が降るしくみを説明して。", a:"北西の季節風が日本海をわたるときに水分を含み、山地にぶつかって上昇し、雪を降らせるから。", e:"採点：①北西季節風＋日本海の水分 ②山地で雪。"},
    {q:"地震のとき、砂地の地盤が水を含んでどろどろになる現象は？", a:"液状化（現象）。うめ立て地など砂地で起こりやすい。", e:"採点：液状化。起こりやすい場所も言えると◎。"},

  kateika_say: { title:"家庭科の記述（説明する）", emo:"🗣️", mode:"speak", subj:"家庭科", cards:[
    {q:"五大栄養素を5つ挙げ、それぞれの主な働きを説明して。", a:"たんぱく質・脂質・炭水化物・無機質・ビタミン。たんぱく質と無機質は体をつくる、ビタミンと無機質は調子を整える、炭水化物・脂質・たんぱく質はエネルギーになる。", e:"採点：①5つ言える ②3つの働き（つくる/整える/エネルギー）に分けられる。"},
    {q:"成長期の中学生に、たんぱく質・カルシウム・鉄が特に必要な理由を説明して。", a:"身長や体重が増える成長期で、骨・筋肉・血液など体の組織を多くつくる必要があるから。", e:"採点：①成長期で体が大きくなる ②組織（骨・筋肉・血液）をつくる材料。"},
    {q:"バランスの良い献立を作る手順を、順番に説明して。", a:"主菜→主食→副菜→汁物の順に決め、最後に6つの食品群でかたよりがないかバランスを確認する。", e:"採点：①主菜から決める ②最後に食品群でバランス確認。"},
    {q:"「一汁三菜」とはどんな献立か説明して。", a:"主食に、汁物1つと、主菜・副菜2種の計3つのおかずを組み合わせた、和食の基本の形。", e:"採点：主食＋一汁（汁物1）＋三菜（主菜1・副菜2）。"},
    {q:"朝食を食べることの役割を、2つ以上説明して。", a:"睡眠中に下がった体温を上げて体を活動状態にする、午前中に必要なエネルギーを補給する、活動力や集中力を保つ。", e:"採点：体温を上げる／エネルギー補給／集中力——のうち2つ以上。"},
    {q:"6つの食品群を「3つの働き」で分類して説明して。", a:"1群・2群は体をつくる、3群・4群は体の調子を整える、5群・6群はエネルギーになる。", e:"採点：1・2＝つくる、3・4＝整える、5・6＝エネルギー。"},
  ]},
  gijutsu_say: { title:"技術の記述（説明する）", emo:"🗣️", mode:"speak", subj:"技術", cards:[
    {q:"発電機が電気を生み出す仕組みを「電磁誘導」という言葉を使って説明して。", a:"発電機はコイルと磁石でできていて、コイルや磁石を動かすと電磁誘導でコイルに電流が流れ、運動エネルギーを電気エネルギーに変換する。", e:"採点：①コイルと磁石 ②電磁誘導で電流 ③運動→電気。"},
    {q:"エネルギー変換効率とは何か、式とあわせて説明して。", a:"供給されるエネルギーのうち、使用目的に利用されるエネルギーの割合。式は「利用目的のエネルギー÷供給されるエネルギー×100」。", e:"採点：①目的に使えた割合 ②式が言える。"},
    {q:"交流が、遠くの発電所から家庭まで電気を送るのに適している理由を説明して。", a:"交流は変圧器で電圧を簡単に変えられ、高電圧にすると送電線に流れる電流が減ってエネルギー損失が少なくなるから。", e:"採点：①変圧しやすい ②高電圧で送電損失が減る。"},
    {q:"再生可能エネルギーとは何か、例を2つ挙げて説明して。", a:"自然界で絶えず供給され、枯渇しないエネルギー。例：太陽光・風力・水力・地熱・バイオマスなど。", e:"採点：①枯渇しない ②具体例2つ。"},
    {q:"火力発電と水力発電のプラス面・マイナス面を、CO₂に注目して説明して。", a:"火力は安定供給できるが化石燃料を燃やしCO₂を多く出す。水力は安定供給でCO₂はほとんど出ないが、ダム建設で自然環境を破壊するおそれがある。", e:"採点：火力＝安定だがCO₂多い／水力＝CO₂少ないが自然破壊。"},
  ]},
  ongaku_say: { title:"音楽の記述（説明する）", emo:"🗣️", mode:"speak", subj:"音楽", cards:[
    {q:"ソナタ形式の流れを、4つの部分の名前で説明して。", a:"提示部→展開部→再現部→コーダ（終結部）の順。提示部で第1・第2主題が示され、展開部で発展、再現部で再び現れ、コーダで締めくくる。", e:"採点：①4つの名前を順に ②各部の役割を一言。"},
    {q:"「動機」とは何か、交響曲第5番の例で説明して。", a:"旋律のもととなる最も小さなまとまり。冒頭の「ジャジャジャジャーン」が動機で、さまざまな所に用いられ曲全体に統一感を与える。", e:"採点：①最小のまとまり ②冒頭の例・全曲で使われる。"},
    {q:"ベートーヴェンについて、出身と特徴を説明して。", a:"ドイツのボン生まれ（1770〜1827）。耳がほとんど聞こえなくなっても作曲を続けた。交響曲第5番は「運命」とよばれる。", e:"採点：①ドイツ出身 ②聴力を失っても作曲 ③運命。"},
    {q:"オーケストラの主な楽器を、4つのグループに分けて説明して。", a:"木管楽器（フルート等）・金管楽器（トランペット等）・弦楽器（ヴァイオリン等）・打楽器（ティンパニ等）の4つ。", e:"採点：4分類の名前＋各1例。"},
    {q:"交響曲第5番の第1〜第4楽章の形式を説明して。", a:"第1楽章＝ソナタ形式、第2楽章＝主題と変奏、第3楽章＝複合三部形式、第4楽章＝ソナタ形式。", e:"採点：4楽章それぞれの形式。"},
  ]},
};

const $ = id => document.getElementById(id);
const SCOPE = new URLSearchParams(location.search).get('subj');   // 科目フィルタ（例: ?subj=国語）
const SUBJFILE = {"国語":"kokugo.html","英語":"eigo.html","理科":"rika.html","家庭科":"kateika.html","技術":"gijutsu.html","歴史":"rekishi.html","地理":"chiri.html","音楽":"ongaku.html","数学":"sugaku.html"};
const MKEY = k => "out_mastery_"+k;            // per-deck mastery {index:level}
const LKEY = d => "out_log_"+d;                 // per-day practiced count
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function getMastery(k){ try{return JSON.parse(localStorage.getItem(MKEY(k))||"{}");}catch(e){return {};} }
function setMastery(k,m){ localStorage.setItem(MKEY(k), JSON.stringify(m)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---- counts: returns {ok,mid,ng,untouched,total,rate} ---- */
function deckStats(k){
  const d=DECKS[k], m=getMastery(k); let ok=0,mid=0,ng=0;
  d.cards.forEach((_,i)=>{ const v=m[i]; if(v===2)ok++; else if(v===1)mid++; else if(v===0)ng++; });
  const total=d.cards.length, untouched=total-ok-mid-ng;
  return {ok,mid,ng,untouched,total,rate:Math.round(ok/total*100)};
}
function overallRate(){
  let ok=0,tot=0; for(const k in DECKS){ const s=deckStats(k); ok+=s.ok; tot+=s.total; }
  return tot?Math.round(ok/tot*100):0;
}

/* ================= HOME ================= */
function renderHome(){
  show("home");
  const keys=Object.keys(DECKS).filter(k=>!SCOPE || DECKS[k].subj===SCOPE);
  let ok=0,tot=0; keys.forEach(k=>{const s=deckStats(k);ok+=s.ok;tot+=s.total;});
  const r=tot?Math.round(ok/tot*100):0;
  $("homeRate").textContent=r+"%"; $("homeBar").style.width=r+"%";
  if(SCOPE){
    $("homeBack").textContent="← "+SCOPE+"にもどる";
    $("homeBack").setAttribute("href", SUBJFILE[SCOPE]||"index.html");
    $("homeTitle").textContent="✍️ "+SCOPE+"：書く・言う";
    $("homeRateLab").textContent="「"+SCOPE+"」の習得率（✓のわりあい）";
    $("checkBtn").style.display="none";
  }
  const wl=$("writeList"), sl=$("speakList"); wl.innerHTML=""; sl.innerHTML="";
  let nw=0, ns=0;
  keys.forEach(k=>{
    const d=DECKS[k], s=deckStats(k);
    const b=document.createElement("button"); b.className="topic";
    b.innerHTML=`<span class="emo">${d.emo}</span>
      <span class="tt"><b>${d.title}</b><small>${d.subj}・全${s.total}問</small></span>
      <span class="rate">${s.rate}%<br><small style="color:#9aa6b8;font-weight:600;">✓${s.ok} △${s.mid} ✗${s.ng}</small></span>
      <span class="arrow">▶</span>`;
    b.onclick=()=>startDeck(k,false);
    if(d.mode==="write"){wl.appendChild(b);nw++;} else {sl.appendChild(b);ns++;}
  });
  $("writeSec").style.display = nw?"":"none";
  $("speakSec").style.display = ns?"":"none";
}
function show(id){ ["home","practice","result","dash"].forEach(x=>$(x).classList.add("hidden")); $(id).classList.remove("hidden"); window.scrollTo(0,0); }

/* ================= PRACTICE ================= */
let st={};
function startDeck(key, onlyWeak){
  const d=DECKS[key], m=getMastery(key);
  let idx=d.cards.map((_,i)=>i);
  if(onlyWeak) idx=idx.filter(i=>m[i]===0||m[i]===1);
  if(idx.length===0){ alert("復習する問題はありません🎉"); return; }
  st={ key, queue:shuffle(idx), pos:0, graded:[] };
  show("practice"); renderCard();
}
function renderCard(){
  const d=DECKS[st.key], i=st.queue[st.pos], c=d.cards[i];
  $("deckName").textContent=d.emo+" "+d.title;
  $("count").textContent=`${st.pos+1} / ${st.queue.length}`;
  const mb=$("modeBadge");
  if(d.mode==="write"){ mb.className="modebadge write"; mb.textContent="✏️ 書いて答える"; $("instrText").innerHTML="ノートに<b>手で書いてから</b>「答えを見る」を押そう。"; }
  else { mb.className="modebadge speak"; mb.textContent="🗣️ 口で答える"; $("instrText").innerHTML="<b>声に出して説明してから</b>「答えを見る」を押そう。"; }
  $("promptText").textContent=c.q;
  $("aText").textContent=c.a; $("aExp").textContent=c.e;
  $("answer").classList.remove("show"); $("revealBtn").classList.remove("hidden");
}
$("revealBtn").onclick=()=>{ $("answer").classList.add("show"); $("revealBtn").classList.add("hidden"); window.scrollTo(0,document.body.scrollHeight); };
function grade(level){
  const i=st.queue[st.pos]; const m=getMastery(st.key); m[i]=level; setMastery(st.key,m);
  st.graded.push(level);
  const d=todayStr(); const n=parseInt(localStorage.getItem(LKEY(d))||"0")+1; localStorage.setItem(LKEY(d),n);
  st.pos++;
  if(st.pos>=st.queue.length) renderResult(); else renderCard();
}
$("gOk").onclick=()=>grade(2); $("gMid").onclick=()=>grade(1); $("gNg").onclick=()=>grade(0);
$("quitBtn").onclick=()=>{ if(confirm("一覧にもどりますか？（ここまでの採点は保存ずみ）")) renderHome(); };

/* ================= RESULT ================= */
function renderResult(){
  show("result");
  const ok=st.graded.filter(x=>x===2).length, tot=st.graded.length;
  $("resNum").textContent=`✓ ${ok} / ${tot}`;
  const weak=st.graded.filter(x=>x<2).length;
  $("resMsg").textContent = weak===0 ? "全部「完璧」！この範囲はバッチリ🎉" : `「もう一度」と「おしい」が ${weak} 問。くり返せば定着するよ💪`;
  const rw=$("redoWeak");
  if(weak>0){ rw.classList.remove("hidden"); $("weakN").textContent=weak; rw.onclick=()=>startDeck(st.key,true); }
  else rw.classList.add("hidden");
  if(typeof reportUnit==="function" && st.queue.length===DECKS[st.key].cards.length) reportUnit(unitReport());
}
function unitReport(){
  const d=DECKS[st.key]; const ok=st.graded.filter(x=>x===2).length, tot=st.graded.length;
  const pct=tot?Math.round(ok/tot*100):0;
  return `📚 ${d.subj}：${d.title}\n書く・言う ${tot}問 → ✓完璧 ${ok}（${pct}%）\n`+
    (pct>=80?"🎉 合格ライン80%クリア！":"あと少し！復習します💪")+"\n#莉映の期末対策";
}
$("redoAll").onclick=()=>startDeck(st.key,false);
$("toHome1").onclick=renderHome;

/* ================= DASHBOARD ================= */
function renderDash(){
  show("dash");
  const r=overallRate(); $("dashRate").textContent=r+"%"; $("dashBar").style.width=r+"%";
  const list=$("dashList"); list.innerHTML="";
  for(const k in DECKS){
    const d=DECKS[k], s=deckStats(k);
    const row=document.createElement("div"); row.className="dash-row";
    row.innerHTML=`<div class="top"><span class="nm">${d.emo} ${d.title}</span><span class="pc">${s.rate}%</span></div>
      <div class="bar"><i style="width:${s.rate}%"></i></div>
      <div class="pills">
        <span class="pill ok">✓完璧 <b>${s.ok}</b></span>
        <span class="pill mid">△おしい <b>${s.mid}</b></span>
        <span class="pill ng">✗もう一度 <b>${s.ng}</b></span>
        <span class="pill">未 <b>${s.untouched}</b></span>
      </div>`;
    list.appendChild(row);
  }
}
$("checkBtn").onclick=renderDash;
$("dashBack").onclick=(e)=>{ e.preventDefault(); renderHome(); };
$("resetBtn").onclick=()=>{ if(confirm("すべての習得記録を消しますか？（元にもどせません）")){ for(const k in DECKS) localStorage.removeItem(MKEY(k)); renderDash(); } };

/* ================= LINE 報告 ================= */
function buildReport(){
  const d=todayStr(); const today=parseInt(localStorage.getItem(LKEY(d))||"0");
  let lines=[`📚 学習報告 ${d}`, `今日やった数：${today}問`, `ぜんたい習得率：${overallRate()}%`, ``];
  const weak=[];
  for(const k in DECKS){ const dk=DECKS[k], s=deckStats(k);
    lines.push(`${dk.emo}${dk.title}：✓${s.ok} △${s.mid} ✗${s.ng}（${s.rate}%）`);
    if(s.ng+s.mid>0) weak.push(dk.title);
  }
  if(weak.length){ lines.push(``, `▼まだ苦手：${weak.join("、")}`); }
  lines.push(``, `#莉映の期末対策`);
  return lines.join("\n");
}
function lineShare(text){
  try{ navigator.clipboard && navigator.clipboard.writeText(text); }catch(e){}  // 保険でコピー
  // LINEアプリ（PCはLINE web）が開き、送る相手＝家族グループを選んで送信できる
  location.href = "https://line.me/R/share?text=" + encodeURIComponent(text);
}
renderHome();
</script>
